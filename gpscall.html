<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>무등산 산악구조 🆘 링크 문자전송</title>

<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  text-align: center;
  padding: 30px;
}

h1 {
  color: #ff4d4d;
  margin-bottom: 20px;
}

input {
  width: 90%;
  max-width: 360px;
  padding: 14px;
  margin-bottom: 15px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  max-width: 360px;
  padding: 18px;
  font-size: 18px;
  font-weight: bold;
  border: none;
  border-radius: 10px;
  background: #ff4d4d;
  color: #fff;
  cursor: pointer;
}

button:active {
  background: #cc0000;
}

.footer {
  margin-top: 30px;
  font-size: 13px;
  color: #aaa;
}
</style>
</head>

<body>

  
<h1>무등산 산악구조 🆘 링크 문자전송</h1>
<p>문자를 받을 번호를 입력한 후<br>버튼을 눌러주세요.</p>

<input
  type="tel"
  id="phone"
  placeholder="받는 사람 번호 (예: 01012345678)"
  inputmode="tel"
/>

<button onclick="sendSMS()">📩 위치 링크 문자 보내기</button>

<div class="footer">
※ 문자전송 버튼은 휴대폰에서 눌러야 합니다
</div>

<br>
  
<!-- 달콩이 이미지 -->
<img src="https://mudeung.github.io/rescue/logogomir1.png"
     alt="달콩이 이미지"
     style="display:block; margin:0 auto;">
  
<script>

/* 세션 유지 */
window.addEventListener("load",function(){
  if(sessionStorage.getItem("authorized")==="true"){
    document.getElementById("loginOverlay").style.display="none";
  }
});
  
function sendSMS() {
  const phone = document.getElementById("phone").value.trim();

  if (!phone) {
    alert("받는 사람 번호를 입력해주세요.");
    return;
  }

  const link = "https://mudeung.github.io/rescue/gps.html";

  const message =
    "[무등산 산악구조 요청]\n" +
    "국립공원 특수구조대 입니다. 링크 클릭 바랍니다 .\n" +
    link;

  const encoded = encodeURIComponent(message);

  // iOS / Android 분기
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const smsURL = isIOS
    ? `sms:${phone}&body=${encoded}`
    : `sms:${phone}?body=${encoded}`;

  window.location.href = smsURL;
}
</script>

<script>
/* =========================
   우클릭 및 개발자도구 단축키 방지
   ========================= */

document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
});

document.addEventListener('keydown', function(e) {

    // F12
    if (e.key === 'F12') {
        e.preventDefault();
        return false;
    }

    // Ctrl + U (페이지 소스 보기)
    if (e.ctrlKey && e.key.toLowerCase() === 'u') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + I (개발자 도구)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + J (콘솔)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') {
        e.preventDefault();
        return false;
    }

    // Ctrl + Shift + C (요소 선택)
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') {
        e.preventDefault();
        return false;
    }

    // Ctrl + S (페이지 저장)
    if (e.ctrlKey && e.key.toLowerCase() === 's') {
        e.preventDefault();
        return false;
    }
});
</script>

  
</body>
</html>
