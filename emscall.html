<script>

/* =====================================================
   API
===================================================== */

const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   STATE
===================================================== */

let accidentTimer = null;
let accidentLoading = false;
let firstLoad = true;

let knownIds = new Set();
let alertedOverdueIds = new Set();

let currentAccidentData = [];

const accidentMarkers = new Map();


/* =====================================================
   DOM
===================================================== */

const accidentCount =
    document.getElementById("accidentCount");

const alertSound =
    document.getElementById("alertSound");


/* =====================================================
   MAP
===================================================== */

const map =
    L.map("map")
    .setView(
        [35.1345,126.9902],
        13
    );


/* =====================================================
   MAP TILE
===================================================== */

const osm =
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom:19,
            attribution:"&copy; OpenStreetMap contributors"
        }
    );

const topo =
    L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        {
            maxZoom:17,
            attribution:"&copy; OpenTopoMap"
        }
    );

const satellite =
    L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom:19,
            attribution:"Tiles &copy; Esri"
        }
    );

topo.addTo(map);


/* =====================================================
   지도 종류
===================================================== */

L.control.layers(
    {
        "🗺 일반지도":osm,
        "⛰ 지형지도":topo,
        "🛰 위성지도":satellite
    },
    null,
    {
        position:"topright"
    }
).addTo(map);


/* =====================================================
   좌표 표시
===================================================== */

const coordControl =
    L.control({
        position:"bottomleft"
    });

coordControl.onAdd =
function(){

    this._div =
        L.DomUtil.create(
            "div",
            "mouse-coords"
        );

    this._div.innerHTML =
        "Lat : --<br>Lng : --";

    return this._div;

};

coordControl.addTo(map);


map.on(
    "mousemove",
    function(e){

        coordControl._div.innerHTML =
            "Lat : " +
            e.latlng.lat.toFixed(6) +
            "<br>Lng : " +
            e.latlng.lng.toFixed(6);

    }
);


map.on(
    "mouseout",
    function(){

        coordControl._div.innerHTML =
            "Lat : --<br>Lng : --";

    }
);


/* =====================================================
   사고 레이어
===================================================== */

const accidentLayer =
    L.layerGroup()
    .addTo(map);


/* =====================================================
   ALERT
===================================================== */

function playAlert(){

    try{

        alertSound.currentTime = 0;

        const promise =
            alertSound.play();

        if(
            promise &&
            typeof promise.catch === "function"
        ){

            promise.catch(
                function(){
                    console.log(
                        "브라우저 자동재생 정책으로 알림음이 차단되었습니다."
                    );
                }
            );

        }

    }
    catch(err){

        console.error(
            "알림음 오류:",
            err
        );

    }

}


/* =====================================================
   POST
===================================================== */

async function postAccident(payload){

    const response =
        await fetch(
            ACCIDENT_API_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },
                body:
                    JSON.stringify(payload)
            }
        );

    const text =
        await response.text();

    let data;

    try{

        data =
            JSON.parse(text);

    }
    catch(e){

        data = {
            result:
                response.ok
                ? "success"
                : "error",
            message:text
        };

    }

    if(!response.ok){

        throw new Error(
            data.message ||
            "HTTP " +
            response.status
        );

    }

    return data;

}


/* =====================================================
   GET
===================================================== */

async function getAccidents(){

    const response =
        await fetch(
            ACCIDENT_API_URL +
            "?action=list&t=" +
            Date.now(),
            {
                method:"GET",
                cache:"no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }

    const data =
        await response.json();

    if(Array.isArray(data)){
        return data;
    }

    if(
        data &&
        Array.isArray(data.data)
    ){
        return data.data;
    }

    if(
        data &&
        Array.isArray(data.items)
    ){
        return data.items;
    }

    if(
        data &&
        Array.isArray(data.rows)
    ){
        return data.rows;
    }

    return [];

}


/* =====================================================
   문자열 정규화
   ★ 전송번호 문제 핵심 수정
===================================================== */

function normalizeKey(value){

    return String(value ?? "")
        .replace(/^\uFEFF/, "")
        .replace(/\u200B/g, "")
        .replace(/\u00A0/g, "")
        .replace(/\s+/g, "")
        .replace(/[_\-.:]/g, "")
        .toLowerCase()
        .trim();

}


/* =====================================================
   값 정규화
===================================================== */

function normalizeValue(value){

    if(
        value === undefined ||
        value === null
    ){

        return "";

    }

    return String(value)
        .replace(/^\uFEFF/, "")
        .replace(/\u200B/g, "")
        .replace(/\u00A0/g, " ")
        .trim();

}


/* =====================================================
   FIELD
   ★ 기존 getField보다 강력하게 수정
===================================================== */

function getField(item,names){

    if(!item || typeof item !== "object"){
        return "";
    }

    /* -----------------------------------------------
       1. 정확한 키 검색
    ------------------------------------------------ */

    for(const name of names){

        if(
            Object.prototype.hasOwnProperty.call(
                item,
                name
            )
        ){

            const value =
                normalizeValue(
                    item[name]
                );

            if(value !== ""){
                return value;
            }

        }

    }


    /* -----------------------------------------------
       2. 정규화된 키 검색
       공백 / _, -, :, BOM 제거
    ------------------------------------------------ */

    const itemKeys =
        Object.keys(item);

    for(const name of names){

        const target =
            normalizeKey(name);

        for(const key of itemKeys){

            if(
                normalizeKey(key) === target
            ){

                const value =
                    normalizeValue(
                        item[key]
                    );

                if(value !== ""){
                    return value;
                }

            }

        }

    }


    return "";

}


/* =====================================================
   ★ 전송번호 추출
   여러 형태의 API / Google Sheet 헤더 대응
===================================================== */

function getTransmissionNumber(item){

    if(!item || typeof item !== "object"){
        return "";
    }


    /* -----------------------------------------------
       1. 가장 흔한 명칭
    ------------------------------------------------ */

    const directNames = [

        "전송번호",
        "전송 번호",
        "전 송 번호",

        "전송번호 ",
        " 전송번호",

        "transmissionNumber",
        "transmissionNo",
        "transmissionID",
        "transmissionId",

        "transferNumber",
        "transferNo",
        "transferID",
        "transferId",

        "sendNumber",
        "sendNo",
        "sendID",
        "sendId",

        "전송ID",
        "전송 ID",
        "전송아이디",

        "전송코드",
        "전송 코드",

        "transmission",
        "transfer",
        "send"

    ];


    const directValue =
        getField(
            item,
            directNames
        );


    if(directValue !== ""){
        return directValue;
    }


    /* -----------------------------------------------
       2. 키 이름을 직접 분석
       "전송번호(자동)" 같은 변형까지 대응
    ------------------------------------------------ */

    const keys =
        Object.keys(item);


    for(const key of keys){

        const normalized =
            normalizeKey(key);


        const isTransmissionKey =

            normalized.includes("전송번호") ||

            normalized.includes("전송id") ||

            normalized.includes("전송코드") ||

            normalized.includes("transmissionnumber") ||

            normalized.includes("transmissionno") ||

            normalized.includes("transmissionid") ||

            normalized.includes("transfernumber") ||

            normalized.includes("transferno") ||

            normalized.includes("transferid") ||

            normalized.includes("sendnumber") ||

            normalized.includes("sendno") ||

            normalized.includes("sendid");


        if(isTransmissionKey){

            const value =
                normalizeValue(
                    item[key]
                );

            if(value !== ""){
                return value;
            }

        }

    }


    return "";

}

/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(value){

    const status =
        String(value || "")
        .trim()
        .toUpperCase();

    if(
        status === "DONE" ||
        status === "완료" ||
        status === "처리완료" ||
        status === "사고처리완료"
    ){
        return "DONE";
    }

    if(
        status === "ARRIVED" ||
        status === "도착" ||
        status === "현장도착"
    ){
        return "ARRIVED";
    }

    return "RECEIVED";

}


/* =====================================================
   ELAPSED
===================================================== */

function getElapsedTime(startTime,endTime){

    if(!startTime){
        return "-";
    }

    const start =
        new Date(startTime);

    if(
        Number.isNaN(
            start.getTime()
        )
    ){
        return "-";
    }

    const end =
        endTime
        ? new Date(endTime)
        : new Date();

    if(
        Number.isNaN(
            end.getTime()
        )
    ){
        return "-";
    }

    let diff =
        Math.floor(
            (
                end.getTime() -
                start.getTime()
            ) / 1000
        );

    if(diff < 0){
        diff = 0;
    }

    const hour =
        Math.floor(diff / 3600);

    diff %= 3600;

    const minute =
        Math.floor(diff / 60);

    const second =
        diff % 60;

    return (
        String(hour).padStart(2,"0") +
        ":" +
        String(minute).padStart(2,"0") +
        ":" +
        String(second).padStart(2,"0")
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPE ATTRIBUTE
===================================================== */

function escapeAttribute(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


/* =====================================================
   ESCAPE JAVASCRIPT
===================================================== */

function escapeJS(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"')
        .replace(/\r/g,"\\r")
        .replace(/\n/g,"\\n")
        .replace(/<\/script/gi,"<\\/script");

}


/* =====================================================
   KAKAO MAP URL
===================================================== */

function getKakaoMapURL(
    lat,
    lng,
    originalURL
){

    if(originalURL){
        return String(originalURL);
    }

    if(
        Number.isFinite(lat) &&
        Number.isFinite(lng)
    ){

        return (
            "https://map.kakao.com/link/map/" +
            encodeURIComponent(
                "무등산 산악사고 위치"
            ) +
            "," +
            lat +
            "," +
            lng
        );

    }

    return "";

}


/* =====================================================
   카카오맵 위치 공유
===================================================== */

async function shareAccident(
    caseId,
    transmissionNumber,
    type,
    address,
    lat,
    lng
){

    lat = Number(lat);
    lng = Number(lng);

    const title =
        "🆘 무등산 산악사고 위치";

    const kakaoMapURL =
        Number.isFinite(lat) &&
        Number.isFinite(lng)

        ?

        "https://map.kakao.com/link/map/" +
        encodeURIComponent(title) +
        "," +
        lat +
        "," +
        lng

        :

        location.href;

    const text =
        title +
        "\n" +
        "사고번호: " +
        caseId +
        "\n" +
        "전송번호: " +
        transmissionNumber +
        "\n" +
        "유형: " +
        type +
        "\n" +
        "주소: " +
        address +
        "\n" +
        (
            Number.isFinite(lat) &&
            Number.isFinite(lng)
            ?
            "위치: " +
            lat.toFixed(6) +
            ", " +
            lng.toFixed(6)
            :
            ""
        );

    try{

        if(navigator.share){

            await navigator.share({
                title:title,
                text:text,
                url:kakaoMapURL
            });

            return;
        }

        const shareText =
            text +
            "\n" +
            kakaoMapURL;

        if(navigator.clipboard){

            await navigator.clipboard.writeText(
                shareText
            );

            alert(
                "📍 사고 위치 정보가 복사되었습니다.\n\n카카오톡에 붙여넣어 공유하세요."
            );

        }
        else{

            prompt(
                "📍 아래 내용을 복사하세요.",
                shareText
            );

        }

    }
    catch(err){

        if(
            err &&
            err.name === "AbortError"
        ){
            return;
        }

        console.error(
            "공유 오류:",
            err
        );

        alert(
            "❌ 위치 공유에 실패했습니다."
        );

    }

}

/* =====================================================
   상태 변경
===================================================== */

async function updateAccidentStatus(
    caseId,
    newStatus
){

    const status =
        normalizeStatus(newStatus);

    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }

    let message = "";
    let action = "";

    if(status === "ARRIVED"){

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

        action =
            "complete";

    }
    else if(status === "DONE"){

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

        action =
            "finish";

    }
    else{
        return;
    }

    if(!confirm(message)){
        return;
    }

    try{

        const result =
            await postAccident({
                action:action,
                id:String(caseId)
            });

        if(
            !result ||
            result.result !== "success"
        ){

            throw new Error(
                result &&
                result.message
                ?
                result.message
                :
                "상태 변경 실패"
            );

        }

        await loadAccidents();

        alert(
            status === "ARRIVED"
            ?
            "🚓 현장 도착 처리 완료"
            :
            "✅ 구조 완료 처리 완료"
        );

    }
    catch(err){

        console.error(
            "상태 변경 오류:",
            err
        );

        alert(
            "❌ 상태 변경 실패\n\n" +
            err.message
        );

    }

}

function renderAccidents(data){

        Array.isArray(data)
        ? data
        : [];

    let receivedCount = 0;
    let arrivedCount = 0;
    let doneCount = 0;

    data.forEach(
        function(item){

            const status =
                normalizeStatus(
                    getField(
                        item,
                        [
                            "status",
                            "state",
                            "상태",
                            "처리상태"
                        ]
                    )
                );

            if(status === "RECEIVED"){
                receivedCount++;
            }
            else if(status === "ARRIVED"){
                arrivedCount++;
            }
            else if(status === "DONE"){
                doneCount++;
            }

        }
    );


    accidentCount.innerHTML =
        "🆘 사고정보 " +
        data.length +
        "건" +

        "　<span style='color:#ff3333'>" +
        "🔴 " +
        receivedCount +
        "</span>" +

        "　<span style='color:#ff9800'>" +
        "🟠 " +
        arrivedCount +
        "</span>" +

        "　<span style='color:#aaa'>" +
        "⚫ " +
        doneCount +
        "</span>";


    accidentLayer.clearLayers();


    const rows =
        [...data].sort(
            function(a,b){

                const ta =
                    new Date(
                        getStartTime(a)
                    ).getTime();

                const tb =
                    new Date(
                        getStartTime(b)
                    ).getTime();

                if(Number.isNaN(ta)){
                    return 1;
                }

                if(Number.isNaN(tb)){
                    return -1;
                }

                return tb - ta;

            }
        );


    const currentIds =
        new Set();


    rows.forEach(
        function(item,index){

            const id =
                getAccidentId(
                    item,
                    index
                );

            currentIds.add(
                String(id)
            );


            /* -----------------------------------------
               전송번호
               ★ 여기서 수정된 함수 사용
            ----------------------------------------- */

            const transmissionNumber =
                getTransmissionNumber(item);


            const status =
                normalizeStatus(
                    getField(
                        item,
                        [
                            "status",
                            "state",
                            "상태",
                            "처리상태"
                        ]
                    )
                );


            const startTime =
                getStartTime(item);


            const endTime =
                getField(
                    item,
                    [
                        "finishTime",
                        "endTime",
                        "completedAt",
                        "doneAt",
                        "완료시간"
                    ]
                );


            const lat =
                Number(
                    getField(
                        item,
                        [
                            "lat",
                            "latitude",
                            "위도"
                        ]
                    )
                );


            const lng =
                Number(
                    getField(
                        item,
                        [
                            "lng",
                            "longitude",
                            "경도"
                        ]
                    )
                );


            const address =
                getField(
                    item,
                    [
                        "address",
                        "주소",
                        "location",
                        "장소"
                    ]
                );


            const type =
                getField(
                    item,
                    [
                        "type",
                        "accidentType",
                        "신고유형",
                        "유형"
                    ]
                ) ||
                "기타";


            const symptom =
                getField(
                    item,
                    [
                        "symptom",
                        "condition",
                        "description",
                        "상황",
                        "내용"
                    ]
                );


            const phone =
                getField(
                    item,
                    [
                        "phone",
                        "tel",
                        "telephone",
                        "연락처"
                    ]
                );


            const kakaoOriginal =
                getField(
                    item,
                    [
                        "kakaoMapURL",
                        "kakaoUrl",
                        "mapUrl",
                        "지도URL"
                    ]
                );


            const kakaoMapURL =
                getKakaoMapURL(
                    lat,
                    lng,
                    kakaoOriginal
                );


            const elapsed =
                getElapsedTime(
                    startTime,
                    endTime || null
                );


            let statusText =
                "접수";

            let statusClass =
                "popup-received";


            if(status === "ARRIVED"){

                statusText =
                    "현장도착";

                statusClass =
                    "popup-arrived";

            }


            if(status === "DONE"){

                statusText =
                    "처리완료";

                statusClass =
                    "popup-done";

            }


            if(
                Number.isFinite(lat) &&
                Number.isFinite(lng)
            ){

                let markerColor =
                    "#ff0000";

                if(status === "ARRIVED"){
                    markerColor =
                        "#ff9800";
                }

                if(status === "DONE"){
                    markerColor =
                        "#777777";
                }


                const marker =
                    L.circleMarker(
                        [lat,lng],
                        {
                            radius:
                                status === "DONE"
                                ? 8
                                : 11,

                            color:
                                markerColor,

                            fillColor:
                                markerColor,

                            fillOpacity:.9,

                            weight:3
                        }
                    );


                const isNew =
                    !firstLoad &&
                    !knownIds.has(
                        String(id)
                    );


                const popupHTML =
                    createAccidentPopup(
                        item,
                        id,
                        transmissionNumber,
                        status,
                        statusText,
                        statusClass,
                        type,
                        symptom,
                        address,
                        phone,
                        startTime,
                        endTime,
                        elapsed,
                        lat,
                        lng,
                        kakaoMapURL
                    );


                marker.bindPopup(
                    popupHTML,
                    {
                        maxWidth:350,
                        minWidth:270,
                        className:
                            "accident-leaflet-popup"
                    }
                );


                marker.on(
                    "click",
                    function(){

                        map.flyTo(
                            [lat,lng],
                            Math.max(
                                map.getZoom(),
                                17
                            ),
                            {
                                animate:true,
                                duration:.8
                            }
                        );

                        marker.openPopup();

                    }
                );


                marker.addTo(
                    accidentLayer
                );


                accidentMarkers.set(
                    String(id),
                    marker
                );


                if(isNew){

                    playAlert();

                    setTimeout(
                        function(){

                            map.flyTo(
                                [lat,lng],
                                17,
                                {
                                    animate:true,
                                    duration:.8
                                }
                            );

                            marker.openPopup();

                        },
                        100
                    );

                }

            }


            /* -----------------------------------------
               10분 이상 미처리
            ----------------------------------------- */

            let overdue = false;


            if(
                status === "RECEIVED" &&
                startTime
            ){

                const start =
                    new Date(
                        startTime
                    ).getTime();

                if(Number.isFinite(start)){

                    overdue =
                        (
                            Date.now() -
                            start
                        ) / 60000 >= 10;

                }

            }


            if(
                overdue &&
                !alertedOverdueIds.has(
                    String(id)
                )
            ){

                alertedOverdueIds.add(
                    String(id)
                );

                if(!firstLoad){
                    playAlert();
                }

            }


            knownIds.add(
                String(id)
            );

        }
    );


    for(
        const oldId of knownIds
    ){

        if(
            !currentIds.has(
                String(oldId)
            )
        ){

            knownIds.delete(
                oldId
            );

        }

    }


    firstLoad = false;

}

/* =====================================================
   LOCAL NATURAL LANGUAGE ANALYZER
===================================================== */

function analyzeLocalQuestion(
    question,
    data
){

    let rows =
        [...data];

    let description = [];


    /* =================================================
       현재 현황
    ================================================= */

    const isSummaryQuestion =

        question.includes("몇 건") ||
        question.includes("몇건") ||
        question.includes("몇개") ||
        question.includes("현황") ||
        question.includes("상황") ||
        question.includes("전체 사고") ||
        question === "현재 사고" ||
        question === "현재 사고 보여줘";


    if(isSummaryQuestion){

        return {
            title:"현재 사고 현황",
            message:
                createSituationSummary(data),
            rows:[]
        };

    }


    /* =================================================
       상태 검색
    ================================================= */

    if(
        question.includes("접수") ||
        question.includes("미처리") ||
        question.includes("출동 대기") ||
        question.includes("출동중")
    ){

        rows =
            rows.filter(
                function(item){

                    return (
                        normalizeStatus(
                            getField(
                                item,
                                [
                                    "status",
                                    "state",
                                    "상태",
                                    "처리상태"
                                ]
                            )
                        ) === "RECEIVED"
                    );

                }
            );

        description.push("접수");

    }


    if(
        question.includes("현장도착") ||
        question.includes("현장 도착") ||
        question.includes("도착한") ||
        question.includes("도착 사고")
    ){

        rows =
            rows.filter(
                function(item){

                    return (
                        normalizeStatus(
                            getField(
                                item,
                                [
                                    "status",
                                    "state",
                                    "상태",
                                    "처리상태"
                                ]
                            )
                        ) === "ARRIVED"
                    );

                }
            );

        description.push("현장도착");

    }


    if(
        question.includes("완료") ||
        question.includes("처리완료") ||
        question.includes("처리 완료") ||
        question.includes("끝난 사고")
    ){

        rows =
            rows.filter(
                function(item){

                    return (
                        normalizeStatus(
                            getField(
                                item,
                                [
                                    "status",
                                    "state",
                                    "상태",
                                    "처리상태"
                                ]
                            )
                        ) === "DONE"
                    );

                }
            );

        description.push("처리완료");

    }


    /* =================================================
       시간 검색
    ================================================= */

    const minuteMatch =
        question.match(
            /(\d+)\s*분/
        );


    if(minuteMatch){

        const minutes =
            Number(
                minuteMatch[1]
            );

        const now =
            Date.now();


        rows =
            rows.filter(
                function(item){

                    const start =
                        getStartTime(item);

                    if(!start){
                        return false;
                    }

                    const time =
                        new Date(start).getTime();

                    if(
                        !Number.isFinite(time)
                    ){
                        return false;
                    }

                    const elapsed =
                        (
                            now -
                            time
                        ) / 60000;


                    if(
                        question.includes("미처리") &&
                        normalizeStatus(
                            getField(
                                item,
                                [
                                    "status",
                                    "state",
                                    "상태",
                                    "처리상태"
                                ]
                            )
                        ) === "DONE"
                    ){
                        return false;
                    }

                    return elapsed >= minutes;

                }
            );

        description.push(
            minutes +
            "분 이상 경과"
        );

    }


    /* =================================================
       오늘 사고
    ================================================= */

    if(
        question.includes("오늘") ||
        question.includes("금일")
    ){

        const now =
            new Date();

        rows =
            rows.filter(
                function(item){

                    const date =
                        new Date(
                            getStartTime(item)
                        );

                    if(
                        Number.isNaN(
                            date.getTime()
                        )
                    ){
                        return false;
                    }

                    return (
                        date.getFullYear() ===
                        now.getFullYear() &&

                        date.getMonth() ===
                        now.getMonth() &&

                        date.getDate() ===
                        now.getDate()
                    );

                }
            );

        description.push("오늘");

    }


    /* =================================================
       최근 사고
    ================================================= */

    if(
        question.includes("최근") ||
        question.includes("최신") ||
        question.includes("마지막")
    ){

        rows.sort(
            function(a,b){

                const ta =
                    new Date(
                        getStartTime(a)
                    ).getTime();

                const tb =
                    new Date(
                        getStartTime(b)
                    ).getTime();

                return tb - ta;

            }
        );

        rows =
            rows.slice(0,1);

        description.push("최근 사고");

    }


    /* =================================================
       가장 오래된 사고
    ================================================= */

    if(
        question.includes("가장 오래된") ||
        question.includes("제일 오래된") ||
        question.includes("오래된 사고") ||
        question.includes("오래 기다린")
    ){

        rows.sort(
            function(a,b){

                const ta =
                    new Date(
                        getStartTime(a)
                    ).getTime();

                const tb =
                    new Date(
                        getStartTime(b)
                    ).getTime();

                return ta - tb;

            }
        );

        rows =
            rows.slice(0,1);

        description.push(
            "가장 오래된 사고"
        );

    }


    /* =================================================
       유형 검색
    ================================================= */

    const typeKeywords = [

        "실족",
        "탈진",
        "조난",
        "추락",
        "부상",
        "골절",
        "출혈",
        "의식",
        "호흡",
        "길잃음",
        "길 잃음",
        "저체온",
        "열탈진"

    ];


    for(
        const keyword of typeKeywords
    ){

        if(
            question.includes(keyword)
        ){

            rows =
                rows.filter(
                    function(item){

                        const type =
                            getField(
                                item,
                                [
                                    "type",
                                    "accidentType",
                                    "신고유형",
                                    "유형"
                                ]
                            );

                        const symptom =
                            getField(
                                item,
                                [
                                    "symptom",
                                    "condition",
                                    "description",
                                    "상황",
                                    "내용"
                                ]
                            );

                        const text =
                            (
                                String(type) +
                                " " +
                                String(symptom)
                            ).toLowerCase();

                        return text.includes(
                            keyword
                        );

                    }
                );

            description.push(keyword);

            break;

        }

    }


    /* =================================================
       위치 검색
    ================================================= */

    const locationKeywords = [

        "장불재",
        "중머리재",
        "입석대",
        "서석대",
        "증심사",
        "새인봉",
        "원효사",
        "무등산",
        "토끼등",
        "바람재",
        "규봉암",
        "꼬막재"

    ];


    for(
        const keyword of locationKeywords
    ){

        if(
            question.includes(keyword)
        ){

            rows =
                rows.filter(
                    function(item){

                        const address =
                            getField(
                                item,
                                [
                                    "address",
                                    "주소",
                                    "location",
                                    "장소"
                                ]
                            );

                        const symptom =
                            getField(
                                item,
                                [
                                    "symptom",
                                    "condition",
                                    "description",
                                    "상황",
                                    "내용"
                                ]
                            );

                        const text =
                            (
                                String(address) +
                                " " +
                                String(symptom)
                            ).toLowerCase();

                        return text.includes(
                            keyword
                        );

                    }
                );

            description.push(keyword);

            break;

        }

    }


    /* =================================================
       전송번호 검색
       ★ 수정된 getTransmissionNumber 사용
    ================================================= */

    const transmissionMatch =
        question.match(
            /(?:전송번호|전송 번호|전송|transmission|transfer|send)\s*[:#\-]?\s*([a-z0-9가-힣\-_]+)/i
        );


    if(transmissionMatch){

        const searchTransmission =
            transmissionMatch[1]
            .toLowerCase();


        rows =
            rows.filter(
                function(item){

                    const value =
                        getTransmissionNumber(
                            item
                        );

                    return String(value)
                        .toLowerCase()
                        .includes(
                            searchTransmission
                        );

                }
            );


        description.push(
            "전송번호 " +
            transmissionMatch[1]
        );

    }
    else if(
        question.includes("전송번호") ||
        question.includes("전송 번호")
    ){

        rows =
            rows.filter(
                function(item){

                    return (
                        getTransmissionNumber(
                            item
                        ) !== ""
                    );

                }
            );

        description.push(
            "전송번호가 있는 사고"
        );

    }


    /* =================================================
       사고 ID 검색
    ================================================= */

    const idMatch =
        originalQuestionForID(
            question
        );


    if(idMatch){

        rows =
            rows.filter(
                function(item,index){

                    return (
                        String(
                            getAccidentId(
                                item,
                                index
                            )
                        )
                        .toLowerCase() ===
                        String(idMatch)
                        .toLowerCase()
                    );

                }
            );

        description.push(
            "사고번호 " +
            idMatch
        );

    }


    /* =================================================
       일반 검색
    ================================================= */

    if(
        description.length === 0
    ){

        const searchWords =
            question
            .replace(
                /찾아줘|찾아 줘|보여줘|보여 줘|검색해줘|검색해 줘|알려줘|알려 줘|해주세요|해줘|줘/g,
                ""
            )
            .trim()
            .split(/\s+/)
            .filter(
                function(word){
                    return word.length >= 2;
                }
            );


        if(searchWords.length){

            rows =
                rows.filter(
                    function(item){

                        const text =
                            createSearchText(item);

                        return searchWords.some(
                            function(word){
                                return text.includes(word);
                            }
                        );

                    }
                );

            description.push(
                "자연어 검색"
            );

        }

    }


    return {

        title:
            description.length
            ? description.join(" + ")
            : "검색 결과",

        message:
            "검색 조건에 맞는 사고가 " +
            rows.length +
            "건입니다.",

        rows:rows

    };

}


/* =====================================================
   ID 추출
===================================================== */

function originalQuestionForID(question){

    const match =
        question.match(
            /(?:사고번호|사고id|id)?\s*([a-z]{1,5}[-_]?\d{1,})/i
        );

    if(match){
        return match[1];
    }

    return null;

}

/* =====================================================
   상황 요약
===================================================== */

function createSituationSummary(data){

    let received = 0;
    let arrived = 0;
    let done = 0;


    data.forEach(
        function(item){

            const status =
                normalizeStatus(
                    getField(
                        item,
                        [
                            "status",
                            "state",
                            "상태",
                            "처리상태"
                        ]
                    )
                );

            if(status === "RECEIVED"){
                received++;
            }
            else if(status === "ARRIVED"){
                arrived++;
            }
            else if(status === "DONE"){
                done++;
            }

        }
    );


    const pending =
        data.filter(
            function(item){

                return (
                    normalizeStatus(
                        getField(
                            item,
                            [
                                "status",
                                "state",
                                "상태",
                                "처리상태"
                            ]
                        )
                    ) !== "DONE"
                );

            }
        )
        .sort(
            function(a,b){

                return (
                    new Date(
                        getStartTime(a)
                    ).getTime()
                    -
                    new Date(
                        getStartTime(b)
                    ).getTime()
                );

            }
        );


    let oldestText = "";


    if(pending.length){

        const oldest =
            pending[0];

        const id =
            getAccidentId(
                oldest,
                0
            );

        const transmissionNumber =
            getTransmissionNumber(
                oldest
            );

        const elapsed =
            getElapsedTime(
                getStartTime(oldest),
                null
            );


        oldestText =
            "\n\n" +
            "⏱ 가장 오래된 미처리:\n" +
            id +
            " / " +
            (
                transmissionNumber
                ?
                "전송번호 " +
                transmissionNumber +
                " / "
                :
                ""
            ) +
            elapsed;

    }


    return (
        "현재 총 " +
        data.length +
        "건입니다.\n\n" +

        "🔴 접수: " +
        received +
        "건\n" +

        "🟠 현장도착: " +
        arrived +
        "건\n" +

        "⚫ 처리완료: " +
        done +
        "건" +

        oldestText
    );

}

                    );


                let statusText =
                    "🔴 접수";

                let className = "";


                if(status === "ARRIVED"){

                    statusText =
                        "🟠 현장도착";

                    className =
                        "arrived";

                }


                if(status === "DONE"){

                    statusText =
                        "⚫ 완료";

                    className =
                        "done";

                }


                html +=

                    '<div ' +
                    'class="ai-result-item ' +
                    className +
                    '" ' +
                    'onclick="' +
                    "focusAccidentById('" +
                    escapeJS(id) +
                    "')" +
                    '">' +

                    "<strong>" +
                    escapeHTML(id) +
                    "</strong>" +

                    "　" +
                    statusText +

                    "<br>" +

                    "전송번호: " +

                    "<span style='color:#5fc3ff;font-weight:bold'>" +

                    escapeHTML(
                        transmissionNumber || "-"
                    ) +

                    "</span>" +

                    "<br>" +

                    "유형: " +
                    escapeHTML(type) +

                    "<br>" +

                    "상황: " +
                    escapeHTML(symptom || "-") +

                    "<br>" +

                    "위치: " +
                    escapeHTML(address || "-") +

                    "<br>" +

                    "경과: " +
                    escapeHTML(elapsed) +

                    "</div>";

            }
        );

    }
    else{

        html +=
            '<div style="margin-top:12px;color:#888;">' +
            "📍 조건에 맞는 사고가 없습니다." +
            "<br><br>" +
            "다른 검색어를 입력해 보세요." +
            "</div>";

    }


    result.innerHTML =
        html;


    if(rows.length === 1){

        setTimeout(
            function(){

                focusAccidentById(
                    getAccidentId(
                        rows[0],
                        0
                    )
                );

            },
            400
        );

    }
    else if(rows.length > 1){

        setTimeout(
            function(){

                focusMultipleAccidents(
                    rows.map(
                        function(item,index){

                            return getAccidentId(
                                item,
                                index
                            );

                        }
                    )
                );

            },
            400
        );

    }

}


/* =====================================================
   사고 ID 찾기
===================================================== */

function findAccidentById(id){

    const target =
        String(id);


    for(
        let i = 0;
        i < currentAccidentData.length;
        i++
    ){

        const item =
            currentAccidentData[i];

        const itemId =
            getAccidentId(
                item,
                i
            );

        if(
            String(itemId) === target
        ){

            return item;

        }

    }

    return null;

}


/* =====================================================
   사고 하나 지도 이동
===================================================== */

function focusAccidentById(id){

    const target =
        String(id);

    const item =
        findAccidentById(target);


    if(!item){

        alert(
            "사고 정보를 찾을 수 없습니다."
        );

        return;

    }


    const marker =
        accidentMarkers.get(target);


    const lat =
        Number(
            getField(
                item,
                [
                    "lat",
                    "latitude",
                    "위도"
                ]
            )
        );


    const lng =
        Number(
            getField(
                item,
                [
                    "lng",
                    "longitude",
                    "경도"
                ]
            )
        );


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        alert(
            "해당 사고의 GPS 좌표가 없습니다."
        );

        return;

    }


    map.flyTo(
        [lat,lng],
        Math.max(
            map.getZoom(),
            17
        ),
        {
            animate:true,
            duration:1
        }
    );


    if(marker){

        setTimeout(
            function(){
                marker.openPopup();
            },
            750
        );

    }

}


/* =====================================================
   여러 사고 지도 이동
===================================================== */

function focusMultipleAccidents(ids){

    const points = [];


    ids.forEach(
        function(id){

            const item =
                findAccidentById(id);

            if(!item){
                return;
            }


            const lat =
                Number(
                    getField(
                        item,
                        [
                            "lat",
                            "latitude",
                            "위도"
                        ]
                    )
                );


            const lng =
                Number(
                    getField(
                        item,
                        [
                            "lng",
                            "longitude",
                            "경도"
                        ]
                    )
                );


            if(
                Number.isFinite(lat) &&
                Number.isFinite(lng)
            ){

                points.push([
                    lat,
                    lng
                ]);

            }

        }
    );


    if(!points.length){
        return;
    }


    if(points.length === 1){

        map.flyTo(
            points[0],
            17
        );

        return;

    }


    const bounds =
        L.latLngBounds(points);


    map.fitBounds(
        bounds,
        {
            padding:[
                80,
                80
            ],
            maxZoom:16
        }
    );

}


/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(
    "load",
    function(){

        startAccidentAutoRefresh();


        setTimeout(
            function(){
                map.invalidateSize();
            },
            1000
        );

    }
);

</script>
