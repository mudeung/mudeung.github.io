/* =====================================================

const ACCIDENT_API_URL =
"https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";

/* =========================================
   Google Apps Script 사고 목록 JSONP 조회
========================================= */
function getAccidentsJSONP() {
  return new Promise((resolve, reject) => {
    const callbackName =
      "rescueList_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 1000000);

    const script = document.createElement("script");
    let settled = false;

    const timeout = setTimeout(() => {
      finish(new Error("사고 목록 조회 시간 초과"));
    }, 15000);

    function finish(error, data) {
      if (settled) return;
      settled = true;

      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();

      if (error) reject(error);
      else resolve(data);
    }

    window[callbackName] = function(data) {
      finish(null, data);
    };

    script.onerror = function() {
      finish(new Error("사고 목록 서버 연결 실패"));
    };

    script.src =
      ACCIDENT_API_URL +
      "?action=list&callback=" +
      encodeURIComponent(callbackName) +
      "&t=" + Date.now();

    document.head.appendChild(script);
  });
}

/* =====================================================
   DEVICE ID
===================================================== */

let DEVICE_ID =
    localStorage.getItem(
        "DEVICE_ID"
    );


if(!DEVICE_ID){

    DEVICE_ID =
        window.crypto &&
        typeof crypto.randomUUID ===
            "function"

        ? crypto.randomUUID()

        : "DEVICE-" +
          Date.now() +
          "-" +
          Math.random()
          .toString(36)
          .slice(2);

    localStorage.setItem(
        "DEVICE_ID",
        DEVICE_ID
    );

}


/* =====================================================
   DEVICE CODE
===================================================== */

function makeDeviceCode(
    deviceId
){

    let hash =
        2166136261;


    for(
        let i=0;
        i<deviceId.length;
        i++
    ){

        hash ^=
            deviceId.charCodeAt(i);

        hash =
            Math.imul(
                hash,
                16777619
            );

    }


    hash >>>= 0;


    return (
        hash % 1296
    )
    .toString(36)
    .toUpperCase()
    .padStart(2,"0");

}


let DEVICE_CODE =
    localStorage.getItem(
        "DEVICE_CODE"
    );


if(
    !DEVICE_CODE ||
    !/^[0-9A-Z]{2}$/.test(
        DEVICE_CODE
    )
){

    DEVICE_CODE =
        makeDeviceCode(
            DEVICE_ID
        );

    localStorage.setItem(
        "DEVICE_CODE",
        DEVICE_CODE
    );

}


/* =====================================================
   TRANSMISSION NUMBER
===================================================== */

function getTransmissionNumber(
    date = new Date()
){

    const year =
        String(
            date.getFullYear()
        ).slice(-2);

    const month =
        String(
            date.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    const hour =
        String(
            date.getHours()
        ).padStart(2,"0");

    const minute =
        String(
            date.getMinutes()
        ).padStart(2,"0");


    return (
        year +
        month +
        day +
        hour +
        minute +
        "-" +
        DEVICE_CODE
    );

}


/* =====================================================
   TIME
===================================================== */

function getNowTime(){

    const d =
        new Date();


    return (
        d.getFullYear() + "-" +
        String(
            d.getMonth()+1
        ).padStart(2,"0") + "-" +
        String(
            d.getDate()
        ).padStart(2,"0") + " " +
        String(
            d.getHours()
        ).padStart(2,"0") + ":" +
        String(
            d.getMinutes()
        ).padStart(2,"0") + ":" +
        String(
            d.getSeconds()
        ).padStart(2,"0")
    );

}


/* =====================================================
   COORDINATE VALIDATION
===================================================== */

function validateCoordinates(
    lat,
    lng
){

    lat =
        Number(
            String(lat)
            .trim()
            .replace(/,/g,".")
        );

    lng =
        Number(
            String(lng)
            .trim()
            .replace(/,/g,".")
        );


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return {
            valid:false,
            message:
                "위도와 경도를 정확하게 입력하세요."
        };

    }


    if(
        lat < -90 ||
        lat > 90
    ){

        return {
            valid:false,
            message:
                "위도는 -90 ~ 90 범위로 입력하세요."
        };

    }


    if(
        lng < -180 ||
        lng > 180
    ){

        return {
            valid:false,
            message:
                "경도는 -180 ~ 180 범위로 입력하세요."
        };

    }


    return {
        valid:true,
        lat:lat,
        lng:lng
    };

}


/* =====================================================
   GPS
===================================================== */

function getCurrentGPS(){

    return new Promise(
        function(resolve,reject){

            if(
                !navigator.geolocation
            ){

                reject(
                    new Error(
                        "이 브라우저에서는 GPS를 지원하지 않습니다."
                    )
                );

                return;

            }


            navigator.geolocation.getCurrentPosition(

                function(position){

                    resolve({

                        lat:
                            position.coords.latitude,

                        lng:
                            position.coords.longitude,

                        accuracy:
                            position.coords.accuracy

                    });

                },

                function(error){

                    let message =
                        "현재 위치를 가져오지 못했습니다.";

                    if(
                        error.code ===
                        error.PERMISSION_DENIED
                    ){

                        message =
                            "위치 권한이 거부되었습니다.";

                    }

                    if(
                        error.code ===
                        error.POSITION_UNAVAILABLE
                    ){

                        message =
                            "현재 위치 정보를 사용할 수 없습니다.";

                    }

                    if(
                        error.code ===
                        error.TIMEOUT
                    ){

                        message =
                            "GPS 위치 확인 시간이 초과되었습니다.";

                    }

                    reject(
                        new Error(
                            message
                        )
                    );

                },

                {
                    enableHighAccuracy:true,
                    timeout:15000,
                    maximumAge:5000
                }

            );

        }
    );

}

/* =====================================================
   ADDRESS → COORDINATE
===================================================== */

function searchAddress(){

    const address =
        addressEl.value.trim();


    if(!address){

        return;

    }


    if(isAddressConversion){

        return;

    }


    if(
        typeof kakao === "undefined" ||
        !kakao.maps ||
        !kakao.maps.services
    ){

        console.warn(
            "Kakao Maps API를 사용할 수 없습니다."
        );

        return;

    }


    isAddressConversion =
        true;


    try{

        const geocoder =
            new kakao.maps.services.Geocoder();


        geocoder.addressSearch(
            address,
            function(result,status){

                try{

                    if(
                        status !==
                        kakao.maps.services.Status.OK ||
                        !result ||
                        result.length === 0
                    ){

                        return;

                    }


                    const item =
                        result[0];


                    const lat =
                        Number(item.y);

                    const lng =
                        Number(item.x);


                    if(
                        !Number.isFinite(lat) ||
                        !Number.isFinite(lng)
                    ){

                        return;

                    }


                    latEl.value =
                        lat.toFixed(6);

                    lngEl.value =
                        lng.toFixed(6);


                    let exactAddress =
                        address;


                    if(
                        item.road_address &&
                        item.road_address.address_name
                    ){

                        exactAddress =
                            item.road_address.address_name;

                    }
                    else if(
                        item.address &&
                        item.address.address_name
                    ){

                        exactAddress =
                            item.address.address_name;

                    }


                    addressEl.value =
                        exactAddress;


                    map.setView(
                        [lat,lng],
                        17,
                        {
                            animate:true
                        }
                    );


                    setReportPreview(
                        lat,
                        lng
                    );


                    L.popup()
                    .setLatLng(
                        [lat,lng]
                    )
                    .setContent(
                        `
                        <div style="
                            font-family:Arial,sans-serif;
                            color:#111;
                            min-width:260px;
                            line-height:1.6;
                        ">

                            <b style="font-size:15px;">
                                📍 신고 위치
                            </b>

                            <hr>

                            <b>주소</b><br>

                            ${escapeHTML(
                                exactAddress
                            )}

                            <br><br>

                            <b>위도</b> :
                            ${lat.toFixed(6)}

                            <br>

                            <b>경도</b> :
                            ${lng.toFixed(6)}

                        </div>
                        `
                    )
                    .openOn(map);


                    setSystemStatus(
                        "주소 → 좌표 변환 완료",
                        "ok"
                    );

                }
                finally{

                    isAddressConversion =
                        false;

                }

            }
        );

    }
    catch(error){

        isAddressConversion =
            false;

        console.error(
            "주소 검색 오류:",
            error
        );

    }

}

function searchAddressFromCoordinates(){

    if(isCoordinateConversion){

        return;

    }


    const checked =
        validateCoordinates(
            latEl.value.trim(),
            lngEl.value.trim()
        );


    if(
        !checked.valid
    ){

    if(
        typeof kakao === "undefined" ||
        !kakao.maps ||

    ){

        console.warn(
            "Kakao Maps API를 사용할 수 없습니다."

        true;

                checked.lng

            checked.lat,
            checked.lng

            new kakao.maps.services.Geocoder();

            checked.lng,

/* =====================================================
   PHONE
===================================================== */

function normalizePhone(
    phone
){

    return String(
        phone || ""
    )
    .replace(
        /[\s-]/g,
        ""
    );

}


function formatPhone(
    phone
){

    const value =
        normalizePhone(
            phone
        );


    if(
        /^01[016789]\d{7,8}$/.test(
            value
        )
    ){

        if(value.length===10){

            return (
                value.slice(0,3) +
                "-" +
                value.slice(3,6) +
                "-" +
                value.slice(6)
            );

        }


        return (
            value.slice(0,3) +
            "-" +
            value.slice(3,7) +
            "-" +
            value.slice(7)
        );

    }


    return phone;

}


/* =====================================================
   SUBMIT - 신고 접수
   - 전송번호 필수 확인
   - 사고번호와 전송번호 분리 표시
   - 중복 클릭 방지
===================================================== */

async function submitData() {

    // 수정 모드이면 기존 수정 기능 사용
    if (editModeCaseId) {
        await updateAccident(editModeCaseId);
        return;
    }

    const condition = conditionEl.value.trim();
    const phone = phoneEl.value.trim();
    const address = addressEl.value.trim();

    const coordinateResult = validateCoordinates(
        latEl.value.trim(),
        lngEl.value.trim()
    );

    if (!selectedType) {
        alert("신고 유형을 선택하세요.");
        return;
    }

    if (!condition) {
        alert("상황 입력 필수");
        conditionEl.focus();
        return;
    }

    const normalizedPhone = normalizePhone(phone);

    if (!/^01[016789]\d{7,8}$/.test(normalizedPhone)) {
        alert(
            "전화 형식이 올바르지 않습니다.\n\n" +
            "예: 010-1234-5678"
        );
        phoneEl.focus();
        return;
    }

    if (!coordinateResult.valid) {
        alert(coordinateResult.message);
        return;
    }

    const lat = coordinateResult.lat;
    const lng = coordinateResult.lng;

    const finalAddress =
        address ||
        `위도 ${lat.toFixed(6)}, 경도 ${lng.toFixed(6)}`;

    const button = document.getElementById("submitReportBtn");

    if (!button || button.disabled) {
        return;
    }

    button.disabled = true;
    button.textContent = "⏳ 신고 접수 중...";

    try {
        // 전송번호 생성
        const transmissionNumber = String(
            getTransmissionNumber(new Date()) || ""
        ).trim();

        if (!transmissionNumber) {
            throw new Error(
                "전송번호를 생성하지 못했습니다. 다시 확인해 주세요."
            );
        }

        const payload = {
            action: "create",

            // 서버 호환용 전송번호 필드
            sendId: transmissionNumber,
            transmissionNumber: transmissionNumber,

            deviceId: DEVICE_ID,
            deviceCode: DEVICE_CODE,

            type: selectedType,
            symptom: condition,
            phone: formatPhone(normalizedPhone),
            address: finalAddress,

            lat: lat,
            lng: lng,

            kakaoMapURL:
                "https://map.kakao.com/link/map/" +
                lat + "," + lng,

            createdAt: getNowTime(),
            status: "RECEIVED"
        };

        // POST는 postAccident 내부에서 한 번만 실행
        const result = await postAccident(payload);

        if (!result || result.result !== "success") {
            throw new Error(
                result?.message || "신고 접수 결과를 확인하지 못했습니다."
            );
        }

        // 서버 발급 사고번호
        const savedAccidentNumber = String(
            result.accidentNumber || ""
        ).trim();

        // 저장된 전송번호
        const savedTransmissionNumber = String(
            getTransmissionNumberFromItem(result) ||
            result.sendId ||
            result.transmissionNumber ||
            transmissionNumber
        ).trim();

        alert(
            "🆘 신고 접수 완료\n\n" +
            "사고번호: " +
            (savedAccidentNumber || "미발급") +
            "\n전송번호: " +
            (savedTransmissionNumber || "미수신") +
            "\n\n🚑 무등산 특수산악구조대에\n" +
            "신고가 정상적으로 접수되었습니다."
        );

        resetReportForm();

        await loadAccidents();

        setSystemStatus("신고 접수 완료", "ok");

    } catch (err) {
        console.error("[신고 접수 오류]", err);

        alert(
            "❌ 신고 결과 확인 실패\n\n" +
            (err.message || "알 수 없는 오류") +
            "\n\n사고 목록과 Google Sheets에서 접수 여부를 먼저 확인하세요." +
            "\n중복 신고 방지를 위해 확인 전 재접수하지 마세요."
        );

        setSystemStatus("신고 결과 확인 필요", "error");

    } finally {
        button.disabled = false;
        button.textContent = "🆘 신고접수";
    }
}

/* =====================================================
   POST API - 신고 및 사고 처리 요청
   - POST 재전송 금지
   - JSONP 사고 목록으로 결과 확인
   - 전송번호 및 사고번호 분리
===================================================== */

async function postAccident(payload) {
    const url = ACCIDENT_API_URL;

    if (!url || !/\/exec(?:\?|$)/.test(url)) {
        throw new Error(
            "Google Apps Script 배포 URL을 확인해 주세요."
        );
    }

    if (!payload || !payload.action) {
        throw new Error("요청 작업(action)이 없습니다.");
    }

    const action = String(payload.action).trim().toLowerCase();

    const request = { ...payload };

    // 전송번호 필드명 통일
    const transmissionNumber = String(
        request.sendId ||
        request.transmissionNumber ||
        request.transmissionNo ||
        request.transferNumber ||
        ""
    ).trim();

    if (action === "create") {
        if (!transmissionNumber) {
            throw new Error(
                "전송번호가 없습니다. 신고 데이터를 확인해 주세요."
            );
        }

        request.sendId = transmissionNumber;
        request.transmissionNumber = transmissionNumber;
    }

    if (
        ["update", "delete", "complete", "finish"].includes(action) &&
        !request.id
    ) {
        throw new Error("처리할 신고 ID가 없습니다.");
    }

    // POST는 반드시 한 번만 전송합니다.
    try {
        await fetch(url, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(request)
        });
    } catch (error) {
        console.error("[사고 요청 전송 오류]", error);

        throw new Error(
            "요청 전송 결과를 확인할 수 없습니다. " +
            "사고 목록과 Google Sheets를 확인해 주세요. " +
            "중복 방지를 위해 자동 재전송하지 않습니다."
        );
    }

    // POST 응답은 no-cors 모드에서 읽을 수 없으므로
    // JSONP 목록을 조회해 처리 결과를 확인합니다.
    for (let attempt = 0; attempt < 10; attempt++) {
        if (attempt > 0) {
            await new Promise(resolve =>
                setTimeout(resolve, 1000)
            );
        }

        try {
            const response = await getAccidentsJSONP();
            const rows = extractAccidentRows(response);

            if (!Array.isArray(rows)) {
                continue;
            }

            const findTarget = () =>
                rows.find((item, index) =>
                    String(getAccidentId(item, index)) ===
                    String(request.id)
                );

            // 신규 신고: 전송번호가 일치하는 저장 데이터 확인
            if (action === "create") {
                const saved = rows.find(item =>
                    getTransmissionNumberFromItem(item) ===
                    transmissionNumber
                );

                if (saved) {
                    return {
                        ...saved,
                        result: "success",
                        id: getAccidentId(saved, 0),
                        sendId: getTransmissionNumberFromItem(saved),
                        transmissionNumber:
                            getTransmissionNumberFromItem(saved),
                        accidentNumber: String(
                            getAccidentField(saved, [
                                "accidentNumber",
                                "사고번호"
                            ]) || ""
                        ).trim()
                    };
                }

                continue;
            }

            // 신고 수정: 저장된 주요 항목 비교
            if (action === "update") {
                const saved = findTarget();

                if (!saved) {
                    continue;
                }

                const savedType = String(
                    getAccidentField(saved, [
                        "type", "accidentType", "신고유형", "유형"
                    ]) || ""
                ).trim();

                const savedSymptom = String(
                    getAccidentField(saved, [
                        "symptom", "condition", "description",
                        "상황", "내용"
                    ]) || ""
                ).trim();

                const savedPhone = normalizePhone(
                    getAccidentField(saved, [
                        "phone", "tel", "telephone", "전화"
                    ]) || ""
                );

                const savedAddress = String(
                    getAccidentField(saved, [
                        "address", "주소", "location", "장소"
                    ]) || ""
                ).trim();

                const savedLat = Number(
                    getAccidentField(saved, [
                        "lat", "latitude", "위도"
                    ])
                );

                const savedLng = Number(
                    getAccidentField(saved, [
                        "lng", "longitude", "경도"
                    ])
                );

                const matches =
                    savedType === String(request.type || "").trim() &&
                    savedSymptom === String(request.symptom || "").trim() &&
                    savedPhone === normalizePhone(request.phone || "") &&
                    savedAddress === String(request.address || "").trim() &&
                    Number.isFinite(savedLat) &&
                    Number.isFinite(savedLng) &&
                    Math.abs(savedLat - Number(request.lat)) < 0.000001 &&
                    Math.abs(savedLng - Number(request.lng)) < 0.000001;

                if (matches) {
                    return {
                        ...saved,
                        result: "success"
                    };
                }

                continue;
            }

            // 삭제: 목록에서 해당 신고가 사라졌는지 확인
            if (action === "delete") {
                if (!findTarget()) {
                    return {
                        result: "success",
                        id: String(request.id)
                    };
                }

                continue;
            }

            // 현장 도착 / 구조 완료
            if (action === "complete" || action === "finish") {
                const saved = findTarget();

                if (!saved) {
                    continue;
                }

                const expectedStatus =
                    action === "complete" ? "ARRIVED" : "DONE";

                const actualStatus = normalizeStatus(
                    getAccidentField(saved, [
                        "status", "state", "상태", "처리상태"
                    ])
                );

                if (actualStatus === expectedStatus) {
                    return {
                        ...saved,
                        result: "success"
                    };
                }

                continue;
            }

            throw new Error(
                "지원하지 않는 요청 작업입니다: " + action
            );

        } catch (error) {
            console.warn(
                "[요청 결과 확인 오류]",
                attempt + 1,
                error
            );
        }
    }

    throw new Error(
        "요청은 전송했지만 저장 결과를 확인하지 못했습니다.\n" +
        "사고 목록과 Google Sheets를 확인해 주세요.\n" +
        "중복 신고 방지를 위해 자동 재전송하지 않았습니다."
    );
}

/* =====================================================
   FIELD
===================================================== */

function getAccidentField(
    item,
    names
){

    if(!item){

        return "";

    }


    for(
        const name of names
    ){

        if(
            item[name] !== undefined &&
            item[name] !== null &&
            String(item[name]).trim() !== ""
        ){

            return item[name];

        }

    }


    return "";

}


/* =====================================================
   NORMALIZE FIELD
===================================================== */

function normalizeFieldName(
    value
){

    return String(
        value ?? ""
    )
    .trim()
    .replace(
        /\s+/g,
        ""
    )
    .replace(
        /_/g,
        ""
    )
    .replace(
        /-/g,
        ""
    )
    .replace(
        /\./g,
        ""
    )
    .replace(
        /\(/g,
        ""
    )
    .replace(
        /\)/g,
        ""
    )
    .toLowerCase();

}


/* =====================================================
   TRANSMISSION NUMBER
===================================================== */

function getTransmissionNumberFromItem(
    item
){

    if(!item){

        return "";

    }


    if(Array.isArray(item)){

        for(
            const value of item
        ){

            if(
                value === undefined ||
                value === null
            ){

                continue;

            }


            const text =
                String(value).trim();


            if(!text){

                continue;

            }


            if(
                /^\d{10}-[A-Z0-9]{2}$/i
                .test(text)
            ){

                return text;

            }


            if(
                /^\d{6,14}-[A-Z0-9]{2,}$/i
                .test(text)
            ){

                return text;

            }

        }

    }


    const directNames = [
    "sendId",
    "sendID",
    "send_id",
    "SendId",
    "transmissionNumber",
    "TransmissionNumber",
    "transmission_number",
    "Transmission_Number",
    "transmissionNo",
    "TransmissionNo",
    "transmissionNO",
    "TransmissionNO",
    "transmission",
    "전송번호",
    "전송 번호",
    "전송번호ID",
    "전송번호 Id",
    "전송ID",
    "번호"
];


    for(
        const name of directNames
    ){

        if(
            Object.prototype.hasOwnProperty.call(
                item,
                name
            )
        ){

            const value =
                item[name];


            if(
                value !== undefined &&
                value !== null &&
                String(value).trim() !== ""
            ){

                return String(
                    value
                ).trim();

            }

        }

    }


    const normalizedNames = [
    "sendid",
    "transmissionnumber",
    "transmissionno",
    "transmission",
    "전송번호",
    "전송번호id",
    "전송id",
    "번호"
];


    const keys =
        Object.keys(
            item
        );


    for(
        const key of keys
    ){

        const normalizedKey =
            normalizeFieldName(
                key
            );


        if(
            normalizedNames.includes(
                normalizedKey
            )
        ){

            const value =
                item[key];


            if(
                value !== undefined &&
                value !== null &&
                String(value).trim() !== ""
            ){

                return String(
                    value
                ).trim();

            }

        }

    }


    for(
        const key of keys
    ){

        const normalizedKey =
            normalizeFieldName(
                key
            );


        if(
            normalizedKey.includes(
                "전송번호"
            ) ||
            normalizedKey.includes(
                "transmissionnumber"
            )
        ){

            const value =
                item[key];


            if(
                value !== undefined &&
                value !== null &&
                String(value).trim() !== ""
            ){

                return String(
                    value
                ).trim();

            }

        }

    }


    for(
        const key of keys
    ){

        const value =
            item[key];


        if(
            value &&
            typeof value === "object" &&
            !Array.isArray(value)
        ){

            const nested =
                getTransmissionNumberFromItem(
                    value
                );


            if(nested){

                return nested;

            }

        }

    }


    for(
        const key of keys
    ){

        const value =
            item[key];


        if(
            value === undefined ||
            value === null
        ){

            continue;

        }


        const text =
            String(value).trim();


        if(!text){

            continue;

        }


        if(
            /^\d{10}-[A-Z0-9]{2}$/i
            .test(text)
        ){

            return text;

        }


        if(
            /^\d{6,14}-[A-Z0-9]{2,}$/i
            .test(text)
        ){

            return text;

        }

    }


    return "";

}


/* =====================================================
   ID
===================================================== */

function getAccidentId(
    item,
    index
){

    if(!item){

        return (
            "UNKNOWN_" +
            index
        );

    }


    const directId =
        getAccidentField(
            item,
            [
                "id",
                "ID",
                "caseId",
                "caseID",
                "case_id",
                "사고ID"
            ]
        );


    if(
        directId !== undefined &&
        directId !== null &&
        String(directId).trim() !== ""
    ){

        return String(
            directId
        ).trim();

    }


    const transmissionNumber =
        getTransmissionNumberFromItem(
            item
        );


    if(transmissionNumber){

        return transmissionNumber;

    }


    const startTime =
        getAccidentStartTime(
            item
        );


    if(startTime){

        return (
            String(startTime) +
            "_" +
            String(index)
        );

    }


    return [
        getAccidentField(
            item,
            [
                "type",
                "accidentType",
                "신고유형",
                "유형"
            ]
        ),

        getAccidentField(
            item,
            [
                "phone",
                "tel",
                "전화"
            ]
        ),

        getAccidentField(
            item,
            [
                "lat",
                "latitude",
                "위도"
            ]
        ),

        getAccidentField(
            item,
            [
                "lng",
                "longitude",
                "경도"
            ]
        ),

        index

    ]
    .map(
        value =>
            String(
                value ?? ""
            ).trim()
    )
    .join("_");

}

/* =====================================================
   STATUS
===================================================== */

function normalizeStatus(
    value
){

    const status =
        String(
            value || ""
        )
        .trim()
        .toUpperCase();


    if(
        status === "DONE" ||
        status === "완료" ||
        status === "처리완료" ||
        status === "사고처리완료"
    ){

        return "DONE";

    }


    if(
        status === "ARRIVED" ||
        status === "도착" ||
        status === "현장도착"
    ){

        return "ARRIVED";

    }


    return "RECEIVED";

}


/* =====================================================
   ELAPSED
===================================================== */

function getElapsedTime(
    startTime,
    endTime=null
){

    if(!startTime){

        return "-";

    }


    const start =
        new Date(
            startTime
        );


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "-";

    }


    const end =
        endTime
        ? new Date(endTime)
        : new Date();


    if(
        Number.isNaN(
            end.getTime()
        )
    ){

        return "-";

    }


    let diff =
        Math.floor(
            (end-start)/1000
        );


    if(diff<0){

        diff=0;

    }


    const hour =
        Math.floor(
            diff/3600
        );


    diff %= 3600;


    const minute =
        Math.floor(
            diff/60
        );


    const second =
        diff%60;


    return (
        String(hour)
        .padStart(2,"0") +
        ":" +
        String(minute)
        .padStart(2,"0") +
        ":" +
        String(second)
        .padStart(2,"0")
    );

}

/* =====================================================
   LIST RESPONSE PARSER
===================================================== */

function extractAccidentRows(
    data
){

    if(Array.isArray(data)){

        return data;

    }


    if(
        data &&
        Array.isArray(data.data)
    ){

        return data.data;

    }


    if(
        data &&
        Array.isArray(data.items)
    ){

        return data.items;

    }


    if(
        data &&
        Array.isArray(data.rows)
    ){

        return data.rows;

    }


    if(
        data &&
        Array.isArray(data.result)
    ){

        return data.result;

    }


    if(
        data &&
        data.data &&
        typeof data.data ===
            "object"
    ){

        if(
            Array.isArray(
                data.data.rows
            )
        ){

            return data.data.rows;

        }


        if(
            Array.isArray(
                data.data.items
            )
        ){

            return data.data.items;

        }

    }


    return [];

}

async function loadAccidents(){

    if(accidentLoading){

        return;

    }


    accidentLoading =
        true;


    try{

        const response =
            await fetch(
                ACCIDENT_API_URL +
                "?action=list&t=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store",
                    headers:{
                        "Accept":
                            "application/json"
                    }
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const text =
            await response.text();


        if(
            !text.trim()
        ){

            throw new Error(
                "서버에서 빈 응답을 받았습니다."
            );

        }


        let data;


        try{

            data =
                JSON.parse(
                    text
                );

        }
        catch(error){

            console.error(
                "JSON 파싱 실패:",
                text
            );

            throw new Error(
                "서버 응답이 올바른 JSON 형식이 아닙니다."
            );

        }


        const rows =
            extractAccidentRows(
                data
            );


        if(
            !Array.isArray(rows)
        ){

            throw new Error(
                "사고 목록 데이터 형식이 올바르지 않습니다."
            );

        }


        currentRows =
            rows;


        renderAccidents(
            rows
        );


        setSystemStatus(
            "시스템 정상 · 마지막 갱신 " +
            new Date().toLocaleTimeString(
                "ko-KR"
            ),
            "ok"
        );

    }
    catch(err){

        console.error(
            "사고 목록 조회 오류:",
            err
        );


        setSystemStatus(
            "사고 목록 조회 실패",
            "error"
        );


        if(firstLoad){

            caseList.innerHTML =
                `
                <div class="case-card">

                    ⚠ 사고 목록을 불러오지 못했습니다.

                    <br><br>

                    ${escapeHTML(
                        err.message ||
                        "알 수 없는 오류"
                    )}

                    <br><br>

                    <button
                        type="button"
                        onclick="loadAccidents()"
                        style="
                            background:#003d5c;
                            color:white;
                            border:1px solid #008dcc;
                        "
                    >
                        🔄 다시 불러오기
                    </button>

                </div>
                `;

        }

    }
    finally{

        accidentLoading =
            false;

    }

}

/* =====================================================
   JSONP - 사고 목록 조회 (CORS 우회)
===================================================== */

function getAccidentsJSONP() {
    return new Promise((resolve, reject) => {
        const callbackName =
            "rescueList_" +
            Date.now() +
            "_" +
            Math.floor(Math.random() * 100000);

        const script = document.createElement("script");

        const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("사고 목록 조회 시간 초과"));
        }, 15000);

        function cleanup() {
            clearTimeout(timeout);
            delete window[callbackName];
            script.remove();
        }

        window[callbackName] = function(data) {
            cleanup();
            resolve(data);
        };

        script.onerror = function() {
            cleanup();
            reject(new Error("사고 목록 서버 연결 실패"));
        };

        script.src =
            ACCIDENT_API_URL +
            "?action=list&callback=" +
            encodeURIComponent(callbackName) +
            "&t=" + Date.now();

        document.head.appendChild(script);
    });
}

/* =====================================================
   SHARE BY ID
===================================================== */

async function shareAccidentById(
    caseId
){

    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    try{

        const target =
            currentRows.find(
                function(row,index){

                    return String(
                        getAccidentId(
                            row,
                            index
                        )
                    ) ===
                    String(caseId);

                }
            );


        if(target){

            await shareAccident(
                target
            );

            return;

        }


        await loadAccidents();


        const refreshedTarget =
            currentRows.find(
                function(row,index){

                    return String(
                        getAccidentId(
                            row,
                            index
                        )
                    ) ===
                    String(caseId);

                }
            );


        if(!refreshedTarget){

            alert(
                "공유할 신고 내용을 찾을 수 없습니다."
            );

            return;

        }


        await shareAccident(
            refreshedTarget
        );

    }
    catch(err){

        console.error(
            "공유 오류:",
            err
        );


        alert(
            "공유할 신고 정보를 가져오지 못했습니다.\n\n" +
            err.message
        );

    }

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    );

}


function escapeJS(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    )
    .replace(
        /\r/g,
        "\\r"
    )
    .replace(
        /\n/g,
        "\\n"
    );

}


/* =====================================================
   FOCUS
===================================================== */

function focusAccident(
    lat,
    lng
){

    lat =
        Number(lat);

    lng =
        Number(lng);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        return;

    }


    map.setView(
        [
            lat,
            lng
        ],
        17
    );


    L.popup()
    .setLatLng(
        [
            lat,
            lng
        ]
    )
    .setContent(
        `
        <div style="
            font-family:Arial,sans-serif;
            color:#111;
        ">

            <b>
                🆘 사고 신고 위치
            </b>

            <br><br>

            위도:
            ${lat.toFixed(6)}

            <br>

            경도:
            ${lng.toFixed(6)}

        </div>
        `
    )
    .openOn(map);

}


/* =====================================================
   FIND CASE
===================================================== */

function findAccidentById(
    caseId
){

    if(!caseId){

        return null;

    }


    for(
        let index=0;
        index<currentRows.length;
        index++
    ){

        const row =
            currentRows[index];


        const id =
            getAccidentId(
                row,
                index
            );


        if(
            String(id) ===
            String(caseId)
        ){

            return row;

        }

    }


    return null;

}

/* =====================================================
   UPDATE
===================================================== */

async function updateAccident(
    caseId
){

    const coordinateResult =
        validateCoordinates(
            latEl.value,
            lngEl.value
        );


    if(
        !caseId ||
        !selectedType ||
        !conditionEl.value.trim() ||
        !phoneEl.value.trim() ||
        !coordinateResult.valid
    ){

        alert(
            "수정할 신고 정보를 모두 확인하세요."
        );

        return;

    }


    const normalizedPhone =
        normalizePhone(
            phoneEl.value.trim()
        );


    if(
        !/^01[016789]\d{7,8}$/.test(
            normalizedPhone
        )
    ){

        alert(
            "전화 형식이 올바르지 않습니다."
        );

        return;

    }


    const lat =
        coordinateResult.lat;

    const lng =
        coordinateResult.lng;


    const address =
        addressEl.value.trim() ||
        `위도 ${lat.toFixed(6)}, 경도 ${lng.toFixed(6)}`;


    const button =
        document.getElementById(
            "submitReportBtn"
        );


    button.disabled =
        true;

    button.textContent =
        "⏳ 수정 저장 중...";


    try{

        const result =
            await postAccident({

                action:
                    "update",

                id:
                    String(caseId),

                type:
                    selectedType,

                symptom:
                    conditionEl.value.trim(),

                phone:
                    formatPhone(
                        normalizedPhone
                    ),

                address:
                    address,

                lat:
                    lat,

                lng:
                    lng,

                kakaoMapURL:
                    "https://map.kakao.com/link/map/" +
                    lat +
                    "," +
                    lng

            });


        if(
            !result ||
            result.result !==
                "success"
        ){

            throw new Error(
                result &&
                result.message
                ?
                result.message
                :
                "수정 실패"
            );

        }


        alert(
            "✏ 신고 내용이 수정되었습니다."
        );


        resetReportForm();


        await loadAccidents();


        setSystemStatus(
            "신고 수정 완료",
            "ok"
        );

    }
    catch(err){

        console.error(
            err
        );


        alert(
            "❌ 신고 수정 실패\n\n" +
            err.message
        );


        setSystemStatus(
            "신고 수정 실패",
            "error"
        );

    }
    finally{

        button.disabled =
            false;

        button.textContent =
            "🆘 신고접수";

    }

}

    ){

        alert(
            "❌ 삭제 비밀번호를 입력하세요."
        );

        return;

    }


    if(
        !confirm(
            "⚠ 신고 내용을 삭제하시겠습니까?\n\n" +
            "삭제하면 Google Sheets에서도 해당 신고가 삭제됩니다."
        )
    ){

        return;

    }


    try{

        const cards =
            Array.from(
                document.querySelectorAll(
                    ".case-card[data-case-id]"
                )
            )
            .filter(
                function(card){

                    return (
                        card.dataset.caseId ===
                        String(caseId)
                    );

                }
            );


        cards.forEach(
            function(card){

                card.style.opacity =
                    ".5";

                card.style.pointerEvents =
                    "none";

            }
        );


        const result =
            await postAccident({

                action:
                    "delete",

                id:
                    String(caseId),

                password:
                    password

            });


        if(
            !result ||
            result.result !==
                "success"
        ){

            throw new Error(
                result &&
                result.message
                ?
                result.message
                :
                "삭제 실패"
            );

        }


        alert(
            "🗑 신고가 삭제되었습니다."
        );


        knownIds.delete(
            String(caseId)
        );


        alertedOverdueIds.delete(
            String(caseId)
        );


        await loadAccidents();


        setSystemStatus(
            "신고 삭제 완료",
            "ok"
        );

    }
    catch(err){

        console.error(
            "삭제 오류:",
            err
        );


        alert(
            "❌ 신고 삭제 실패\n\n" +
            err.message
        );


        await loadAccidents();

    }

}


/* =====================================================
   STATUS
===================================================== */

async function updateAccidentStatus(
    caseId,
    newStatus
){

    const status =
        normalizeStatus(
            newStatus
        );


    if(!caseId){

        alert(
            "사고 ID가 없습니다."
        );

        return;

    }


    let message =
        "처리하시겠습니까?";


    let action =
        "";


    if(
        status === "ARRIVED"
    ){

        message =
            "🚓 현장 도착으로 변경하시겠습니까?";

        action =
            "complete";

    }


    if(
        status === "DONE"
    ){

        message =
            "✅ 구조 완료로 변경하시겠습니까?";

        action =
            "finish";

    }


    if(!action){

        return;

    }


    if(
        !confirm(
            message
        )
    ){

        return;

    }


    try{

        const result =
            await postAccident({

                action:
                    action,

                id:
                    String(caseId)

            });


        if(
            !result ||
            result.result !==
                "success"
        ){

            throw new Error(
                result &&
                result.message
                ?
                result.message
                :
                "상태 변경 실패"
            );

        }


        alert(
            status === "ARRIVED"
            ?
            "🚓 현장 도착 처리 완료"
            :
            "✅ 구조 완료 처리 완료"
        );


        await loadAccidents();


        setSystemStatus(
            status === "ARRIVED"
            ?
            "현장 도착 처리 완료"
            :
            "구조 완료 처리 완료",
            "ok"
        );

    }
    catch(err){

        console.error(
            err
        );


        alert(
            "❌ 상태 변경 실패\n\n" +
            err.message
        );


        setSystemStatus(
            "상태 변경 실패",
            "error"
        );

    }

}


/* =====================================================
   ALERT
===================================================== */

function playAlert(){

    const audio =
        document.getElementById(
            "alertSound"
        );


    if(!audio){

        return;

    }


    try{

        audio.currentTime =
            0;


        const promise =
            audio.play();


        if(
            promise &&
            typeof promise.catch ===
                "function"
        ){

            promise.catch(
                function(err){

                    console.log(
                        "알림음 재생 제한:",
                        err
                    );

                }
            );

        }

    }
    catch(error){

        console.log(
            "알림음 오류:",
            error
        );

    }

}


/* =====================================================
   AUTO REFRESH
===================================================== */

function startAccidentAutoRefresh(){

    if(accidentTimer){

        clearInterval(
            accidentTimer
        );

        accidentTimer =
            null;

    }


    loadAccidents();


    accidentTimer =
        setInterval(
            function(){

                /*
                 * 다른 탭에 있을 때는 요청하지 않음
                 */

                if(
                    document.hidden
                ){

                    return;

                }


                loadAccidents();

            },
            10000
        );

}
