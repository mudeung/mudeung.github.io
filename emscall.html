<script>

/* =====================================================
   API
====================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbwUbacHm34YkWh--zL_e590P6h4S5wQo3iF8tCVZu71ZaTunTwdZ1TMLVqkyuHu-izW/exec";


/* =====================================================
   지도
====================================================== */

let map;

let markers = [];

let openedInfoWindow = null;

let openedMarker = null;


/* =====================================================
   지도 초기화
====================================================== */

function initMap(){

    map =
        new kakao.maps.Map(

            document.getElementById("map"),

            {
                center:
                    new kakao.maps.LatLng(
                        35.1345,
                        126.9902
                    ),

                level:6
            }

        );

}

initMap();


/* =====================================================
   DOM
====================================================== */

const listArea =
    document.getElementById("listArea");


/* =====================================================
   신고 관리
====================================================== */

let knownIds =
    new Set();

let alertedOverdueIds =
    new Set();

let overdueIntervals =
    new Map();

let firstLoad =
    true;


/* =====================================================
   현재 신고 데이터
====================================================== */

window.rescueCases =
    new Map();


/* =====================================================
   상태 통일
====================================================== */

function normalizeStatus(status){

    const value =
        String(status || "")
        .trim()
        .toUpperCase();


    if(

        value === "DONE" ||
        value === "완료" ||
        value === "처리완료" ||
        value === "사고처리완료"

    ){

        return "사고처리완료";

    }


    if(

        value === "ARRIVED" ||
        value === "도착" ||
        value === "현장도착"

    ){

        return "현장도착";

    }


    return "사고접수";

}


/* =====================================================
   경과시간
====================================================== */

function getElapsedTime(
    startTime,
    endTime = null
){

    if(!startTime){
        return "시간 정보 없음";
    }


    const start =
        new Date(startTime);


    const end =
        endTime
        ? new Date(endTime)
        : new Date();


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return "시간 정보 오류";

    }


    const diff =
        Math.max(
            0,
            Math.floor(
                (end - start) / 1000
            )
        );


    const h =
        Math.floor(
            diff / 3600
        );


    const m =
        Math.floor(
            (diff % 3600) / 60
        );


    const s =
        diff % 60;


    if(h > 0){

        return `${h}시간 ${m}분 ${s}초 경과`;

    }


    return `${m}분 ${s}초 경과`;

}


/* =====================================================
   마커 색상
====================================================== */

function getMarkerColor(status){

    const normalized =
        normalizeStatus(status);


    if(
        normalized === "사고처리완료"
    ){

        return "#777777";

    }


    if(
        normalized === "현장도착"
    ){

        return "#fb8c00";

    }


    return "#e53935";

}


/* =====================================================
   원형 마커
====================================================== */

function createMarkerImage(status){

    const color =
        getMarkerColor(status);


    const svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="44"
            height="44"
            viewBox="0 0 44 44"
        >

            <circle
                cx="22"
                cy="22"
                r="19"
                fill="${color}"
                stroke="#ffffff"
                stroke-width="3"
            />

            <circle
                cx="22"
                cy="22"
                r="7"
                fill="#ffffff"
            />

        </svg>

    `;


    return new kakao.maps.MarkerImage(

        "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(svg),

        new kakao.maps.Size(
            44,
            44
        ),

        {
            offset:
                new kakao.maps.Point(
                    22,
                    22
                )
        }

    );

}


/* =====================================================
   지도 팝업
====================================================== */

function createInfoWindow(
    item,
    lat,
    lng
){

    const status =
        normalizeStatus(item.status);


    let statusColor =
        "#e53935";


    let statusText =
        "🔴 사고 접수";


    if(
        status === "현장도착"
    ){

        statusColor =
            "#fb8c00";

        statusText =
            "🟠 현장도착";

    }


    if(
        status === "사고처리완료"
    ){

        statusColor =
            "#777777";

        statusText =
            "⚪ 사고처리완료";

    }


    /*
     * Apps Script getList()
     * r[12] → sendId
     */

    const sendId =
        String(
            item.sendId || ""
        ).trim();


    const sendIdHTML =
        sendId
        ?
        `
            <br><br>

            📨 <b>전송번호</b><br>

            <span
                style="
                    display:inline-block;
                    margin-top:4px;
                    padding:4px 7px;
                    background:#263238;
                    color:#00897b;
                    border-radius:4px;
                    font-weight:bold;
                "
            >
                ${escapeHTML(sendId)}
            </span>
        `
        :
        `
            <br><br>

            📨 <b>전송번호</b><br>

            번호없음
        `;


    const infoContent = `

        <div
            style="
                padding:12px;
                color:#222;
                font-family:Arial,sans-serif;
                font-size:13px;
                min-width:250px;
                max-width:300px;
                line-height:1.5;
            "
        >

            <div
                style="
                    font-size:16px;
                    font-weight:bold;
                    margin-bottom:8px;
                "
            >
                🆘 무등산 산악사고 공유
            </div>


            <div
                style="
                    display:inline-block;
                    padding:5px 10px;
                    background:${statusColor};
                    color:#fff;
                    border-radius:5px;
                    font-weight:bold;
                    margin-bottom:8px;
                "
            >
                ${statusText}
            </div>


            <br>


            🚨 <b>신고유형</b><br>

            ${escapeHTML(item.type || "미입력")}


            <br><br>


            🕒 <b>접수시간</b><br>

            ${
                item.time
                ?
                new Date(
                    item.time
                ).toLocaleString("ko-KR")
                :
                ""
            }


            <br><br>


            ⏱ <b>경과시간</b><br>

            ${
                getElapsedTime(
                    item.time,
                    item.finishTime
                )
            }


            <br><br>


            🏠 <b>주소</b><br>

            ${escapeHTML(item.address || "주소없음")}


            <br><br>


            📞 <b>연락처</b><br>

            ${escapeHTML(item.phone || "번호없음")}


            ${sendIdHTML}


            <br><br>


            📝 <b>상황</b><br>

            ${escapeHTML(item.symptom || "내용없음")}


            <br><br>


            📍 <b>좌표</b><br>

            ${lat.toFixed(6)}, ${lng.toFixed(6)}


            ${
                item.completeTime
                ?
                `
                    <br><br>

                    🚑 <b>현장도착</b><br>

                    ${
                        new Date(
                            item.completeTime
                        ).toLocaleString("ko-KR")
                    }
                `
                :
                ""
            }


            ${
                item.finishTime
                ?
                `
                    <br><br>

                    ⚪ <b>사고처리 완료</b><br>

                    ${
                        new Date(
                            item.finishTime
                        ).toLocaleString("ko-KR")
                    }
                `
                :
                ""
            }


            <div style="margin-top:12px;">

                <a
                    href="
                        https://map.kakao.com/link/map/구조요청 위치,${lat},${lng}
                    "
                    target="_blank"
                    style="
                        color:#1976d2;
                        text-decoration:none;
                        font-weight:bold;
                    "
                >
                    📍 카카오맵에서 보기
                </a>

            </div>

        </div>

    `;


    return new kakao.maps.InfoWindow({

        content:
            infoContent,

        removable:
            true

    });

}


/* =====================================================
   HTML 특수문자 처리
====================================================== */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   응급환자 경고 타이머 정리
====================================================== */

function clearOverdueTimer(id){

    if(
        overdueIntervals.has(id)
    ){

        clearInterval(
            overdueIntervals.get(id)
        );


        overdueIntervals.delete(id);

    }

}


/* =====================================================
   응급환자 3분 초과
====================================================== */

function checkOverdue(
    item,
    div
){

    const status =
        normalizeStatus(item.status);


    if(
        item.type !== "응급환자"
    ){

        return;

    }


    if(
        status === "사고처리완료"
    ){

        div.classList.remove(
            "blink"
        );


        clearOverdueTimer(
            item.id
        );


        return;

    }


    const start =
        new Date(item.time);


    if(
        Number.isNaN(
            start.getTime()
        )
    ){

        return;

    }


    const diffSeconds =
        Math.floor(
            (new Date() - start) / 1000
        );


    if(
        diffSeconds < 180
    ){

        return;

    }


    div.classList.add(
        "blink"
    );


    if(
        alertedOverdueIds.has(item.id)
    ){

        return;

    }


    alertedOverdueIds.add(
        item.id
    );


    const playAlert =
        () => {

            const alertSound =
                document.getElementById(
                    "alertSound"
                );


            if(!alertSound){
                return;
            }


            alertSound.currentTime =
                0;


            alertSound.play()
                .catch(
                    () => {}
                );

        };


    playAlert();


    const interval =
        setInterval(
            playAlert,
            30000
        );


    overdueIntervals.set(
        item.id,
        interval
    );

}


/* =====================================================
   신고 공유
====================================================== */

async function shareCase(item){

    const status =
        normalizeStatus(item.status);


    let statusText =
        "🔴 사고 접수";


    if(
        status === "현장도착"
    ){

        statusText =
            "🟠 현장도착";

    }


    if(
        status === "사고처리완료"
    ){

        statusText =
            "⚪ 사고처리완료";

    }


    /* =================================================
       전송번호
       Apps Script의 sendId 사용
    ================================================= */

    const sendId =
        String(
            item.sendId || ""
        ).trim();


    const sendIdText =
        sendId
        ?
        sendId
        :
        "번호없음";


    /* =================================================
       카카오맵 링크
    ================================================= */

    let mapLink = "";


    if(
        item.lat &&
        item.lng
    ){

        mapLink =

            "https://map.kakao.com/link/map/" +

            encodeURIComponent(
                "구조요청 위치"
            ) +

            "," +

            item.lat +

            "," +

            item.lng;

    }


    /* =================================================
       공유 내용
    ================================================= */

    const shareText =

`🆘 무등산 산악사고 공유

${statusText}

🚨 신고유형
${item.type || "미입력"}

🕒 접수시간
${
    item.time
    ?
    new Date(
        item.time
    ).toLocaleString("ko-KR")
    :
    "미입력"
}

⏱ 경과시간
${getElapsedTime(
    item.time,
    item.finishTime
)}

📨 전송번호
${sendIdText}

🏠 주소
${item.address || "주소없음"}

📞 연락처
${item.phone || "번호없음"}

📝 상황
${item.symptom || "내용없음"}

📍 좌표
${
    item.lat && item.lng
    ?
    `${item.lat}, ${item.lng}`
    :
    "좌표없음"
}

${
    mapLink
    ?
    "📍 무등산 산악사고 위치\n" + mapLink
    :
    ""
}`;


    /* =================================================
       모바일 기본 공유
    ================================================= */

    if(
        typeof navigator !== "undefined" &&
        typeof navigator.share === "function"
    ){

        try{

            await navigator.share({

                title:
                    "🆘 무등산특수산악구조대",

                text:
                    shareText

            });


            return;

        }
        catch(error){

            if(
                error &&
                error.name === "AbortError"
            ){

                return;

            }


            console.log(
                "Web Share 실패:",
                error
            );

        }

    }


    /* =================================================
       클립보드
    ================================================= */

    try{

        if(
            navigator.clipboard &&
            typeof navigator.clipboard.writeText ===
                "function"
        ){

            await navigator.clipboard.writeText(
                shareText
            );


            alert(
                "📋 신고 내용이 복사되었습니다.\n\n" +
                "카카오톡이나 문자에 붙여넣어 주세요."
            );


            return;

        }

    }
    catch(error){

        console.log(
            "Clipboard 실패:",
            error
        );

    }


    /* =================================================
       구형 브라우저
    ================================================= */

    const textArea =
        document.createElement(
            "textarea"
        );


    textArea.value =
        shareText;


    textArea.style.position =
        "fixed";


    textArea.style.top =
        "0";


    textArea.style.left =
        "-9999px";


    textArea.style.width =
        "1px";


    textArea.style.height =
        "1px";


    document.body.appendChild(
        textArea
    );


    textArea.focus();

    textArea.select();


    try{

        document.execCommand(
            "copy"
        );


        alert(
            "📋 신고 내용이 복사되었습니다.\n\n" +
            "카카오톡이나 문자에 붙여넣어 주세요."
        );

    }
    catch(error){

        alert(
            shareText
        );

    }


    document.body.removeChild(
        textArea
    );

}


/* =====================================================
   신고 공유 버튼 이벤트
====================================================== */

document.addEventListener(
    "click",
    async function(e){

        const button =
            e.target.closest(
                ".share-btn"
            );


        if(!button){
            return;
        }


        e.preventDefault();


        const id =
            button.getAttribute(
                "data-share-id"
            );


        if(!id){

            alert(
                "신고 정보를 찾을 수 없습니다."
            );


            return;

        }


        const item =
            window.rescueCases
            ?
            window.rescueCases.get(
                String(id)
            )
            :
            null;


        if(!item){

            alert(
                "신고 정보를 불러오는 중입니다.\n" +
                "잠시 후 다시 눌러주세요."
            );


            return;

        }


        await shareCase(item);

    }
);


/* =====================================================
   현장도착
====================================================== */

async function completeCase(id){

    if(
        !confirm(
            "구조대원이 현장에 도착했습니까?"
        )
    ){

        return;

    }


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify({
                            action:"complete",
                            id:id
                        })
                }
            );


        const result =
            await response.json();


        if(
            result.result !==
                "success"
        ){

            alert(
                result.message ||
                "현장도착 처리에 실패했습니다."
            );


            return;

        }


        clearOverdueTimer(id);

        loadData();

    }
    catch(err){

        console.error(err);


        alert(
            "현장도착 처리 중 오류가 발생했습니다."
        );

    }

}


/* =====================================================

/* =====================================================
   신고 목록
====================================================== */

async function loadData(){

    try{

        const res =
            await fetch(
                API_URL +
                "?action=list",
                {
                    cache:"no-store"
                }
            );


        const data =
            await res.json();


        if(
            !Array.isArray(data)
        ){

            throw new Error(
                "서버 응답 형식이 올바르지 않습니다."
            );

        }


        listArea.innerHTML = "";


        /* =================================================
           신고 데이터 저장
        ================================================= */

        window.rescueCases.clear();


        data.forEach(
            item => {

                window.rescueCases.set(
                    String(item.id),
                    item
                );

            }
        );


        /* =================================================
           기존 마커 제거
        ================================================= */

        markers.forEach(
            marker => {
                marker.setMap(null);
            }
        );


        markers = [];


        /* =================================================
           팝업 닫기
        ================================================= */

        if(openedInfoWindow){

            openedInfoWindow.close();

            openedInfoWindow = null;

            openedMarker = null;

        }


        /* =================================================
           신고 없음
        ================================================= */

        if(!data.length){

            listArea.innerHTML =
                "현재 접수된 신고가 없습니다.";

            return;

        }


        /* =================================================
           신규 신고
        ================================================= */

        if(firstLoad){

            data.forEach(
                item => {

                    knownIds.add(
                        item.id
                    );

                }
            );


            firstLoad = false;

        }
        else{

            data.forEach(
                item => {

                    if(
                        !knownIds.has(
                            item.id
                        )
                    ){

                        knownIds.add(
                            item.id
                        );


                        alert(
                            "🚨 새로운 신고 접수!"
                        );


                        const alertSound =
                            document.getElementById(
                                "alertSound"
                            );


                        if(alertSound){

                            alertSound.currentTime =
                                0;


                            alertSound.play()
                                .catch(
                                    () => {}
                                );

                        }

                    }

                }
            );

        }


        /* =================================================
           최신순
        ================================================= */

        data.sort(
            (a,b) =>
                new Date(b.time) -
                new Date(a.time)
        );


        /* =================================================
           신고 카드
        ================================================= */

        data.forEach(
            item => {

                const status =
                    normalizeStatus(
                        item.status
                    );


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "card" +
                    (
                        status ===
                        "사고처리완료"
                        ?
                        " done"
                        :
                        ""
                    );


                div.setAttribute(
                    "data-time",
                    item.time || ""
                );


                if(item.finishTime){

                    div.setAttribute(
                        "data-finish-time",
                        item.finishTime
                    );

                }


                /* =================================================
                   상태
                ================================================= */

                let statusHTML =
                    "";


                if(
                    status ===
                    "사고처리완료"
                ){

                    statusHTML = `
                        <div class="status done">
                            ⚪ 사고처리완료
                        </div>
                    `;

                }
                else if(
                    status ===
                    "현장도착"
                ){

                    statusHTML = `
                        <div class="status arrived">
                            🟠 현장도착
                        </div>
                    `;

                }
                else{

                    statusHTML = `
                        <div class="status received">
                            🔴 사고 접수
                        </div>
                    `;

                }


                /* =================================================
                   현장도착 시간
                ================================================= */

                let completeHTML =
                    "";


                if(item.completeTime){

                    completeHTML = `

                        <div class="time">

                            🚑 현장도착:

                            ${
                                new Date(
                                    item.completeTime
                                ).toLocaleString(
                                    "ko-KR"
                                )
                            }

                        </div>

                    `;

                }


                /* =================================================
                   완료 시간
                ================================================= */

                let finishHTML =
                    "";


                if(item.finishTime){

                    finishHTML = `

                        <div class="time">

                            ✅ 사고처리 완료:

                            ${
                                new Date(
                                    item.finishTime
                                ).toLocaleString(
                                    "ko-KR"
                                )
                            }

                        </div>

                    `;

                }


                /* =================================================
                   처리 버튼
                ================================================= */

                let buttonHTML =
                    "";


                if(
                    status ===
                    "사고처리완료"
                ){

                    buttonHTML = `

                        <span
                            style="
                                display:inline-block;
                                margin-top:8px;
                                color:#aaa;
                                font-weight:bold;
                            "
                        >
                            ✔ 처리완료
                        </span>

                    `;

                }
                else if(
                    status ===
                    "현장도착"
                ){

                    buttonHTML = `

                        <button
                            type="button"
                            class="complete-btn"
                            data-action="finish"
                            data-case-id="${escapeHTML(String(item.id))}"
                        >
                            ✅ 사고처리 완료
                        </button>

                    `;

                }
                else{

                    buttonHTML = `

                        <button
                            type="button"
                            class="complete-btn"
                            data-action="complete"
                            data-case-id="${escapeHTML(String(item.id))}"
                        >
                            🚑 구조대원 현장도착
                        </button>

                    `;

                }


                /* =================================================
                   공유 버튼
                ================================================= */

                const shareButtonHTML = `

                    <button
                        type="button"
                        class="share-btn"
                        data-share-id="${escapeHTML(String(item.id))}"
                    >
                        📤 신고 공유
                    </button>

                `;


                /* =================================================
                   전송번호
                ================================================= */

                const sendId =
                    String(
                        item.sendId || ""
                    ).trim();


                const sendIdHTML =
                    sendId
                    ?
                    `
                        <div class="send-number">

                            📨 전송번호:
                            ${escapeHTML(sendId)}

                        </div>
                    `
                    :
                    `
                        <div class="send-number">

                            📨 전송번호:
                            번호없음

                        </div>
                    `;


                /* =================================================
                   카드 내용
                ================================================= */

                div.innerHTML = `

                    <div class="time">

                        🕒 접수:

                        ${
                            item.time
                            ?
                            new Date(
                                item.time
                            ).toLocaleString(
                                "ko-KR"
                            )
                            :
                            ""
                        }

                    </div>


                    <div class="time elapsed">

                        ⏱

                        ${
                            getElapsedTime(
                                item.time,
                                item.finishTime
                            )
                        }

                    </div>


                    ${statusHTML}


                    ${completeHTML}


                    ${finishHTML}


                    <div
                        style="
                            margin-top:5px;
                            font-size:15px;
                            font-weight:bold;
                            color:#ff5252;
                        "
                    >

                        🚨
                        ${escapeHTML(item.type || "미입력")}

                    </div>


                    <br>


                    🏠
                    ${escapeHTML(item.address || "주소없음")}


                    <br><br>


                    📞
                    ${escapeHTML(item.phone || "번호없음")}


                    <br>

                    ${sendIdHTML}


                    <br>


                    📝
                    ${escapeHTML(item.symptom || "내용없음")}


                    <div class="coord">

                        위도:
                        ${item.lat}

                        /

                        경도:
                        ${item.lng}

                    </div>


                    <a
                        class="maplink"
                        href="
                            https://map.kakao.com/link/map/구조요청 위치,${item.lat},${item.lng}
                        "
                        target="_blank"
                    >
                        📍 지도보기
                    </a>


                    <div class="button-area">

                        ${buttonHTML}

                        ${shareButtonHTML}

                    </div>


                    <div class="share-message">

                        📤 신고 공유 준비 완료

                    </div>

                `;


                listArea.appendChild(
                    div
                );


                /* =================================================
                   응급환자
                ================================================= */

                checkOverdue(
                    item,
                    div
                );


                /* =================================================
                   지도
                ================================================= */

                if(
                    item.lat &&
                    item.lng
                ){

                    const lat =
                        Number(
                            item.lat
                        );


                    const lng =
                        Number(
                            item.lng
                        );


                    if(
                        Number.isFinite(lat) &&
                        Number.isFinite(lng)
                    ){

                        const position =
                            new kakao.maps.LatLng(
                                lat,
                                lng
                            );


                        const markerImage =
                            createMarkerImage(
                                status
                            );


                        const marker =
                            new kakao.maps.Marker({

                                map:map,

                                position:position,

                                title:
                                    item.type ||
                                    "무등산 산악사고 공유",

                                image:
                                    markerImage

                            });


                        markers.push(
                            marker
                        );


                        const infoWindow =
                            createInfoWindow(
                                item,
                                lat,
                                lng
                            );


                        kakao.maps.event.addListener(

                            marker,

                            "click",

                            function(){

                                if(
                                    openedMarker ===
                                    marker
                                ){

                                    if(
                                        openedInfoWindow
                                    ){

                                        openedInfoWindow.close();

                                    }


                                    openedInfoWindow =
                                        null;


                                    openedMarker =
                                        null;


                                    return;

                                }


                                if(
                                    openedInfoWindow
                                ){

                                    openedInfoWindow.close();

                                }


                                infoWindow.open(
                                    map,
                                    marker
                                );


                                openedInfoWindow =
                                    infoWindow;


                                openedMarker =
                                    marker;

                            }

                        );

                    }

                }

            }
        );


        /* =================================================
           모든 마커 표시
        ================================================= */

        if(
            markers.length > 0
        ){

            const bounds =
                new kakao.maps.LatLngBounds();


            markers.forEach(
                marker => {

                    bounds.extend(
                        marker.getPosition()
                    );

                }
            );


            map.setBounds(
                bounds
            );

        }

    }
    catch(err){

        console.error(err);


        listArea.innerHTML =
            "구글시트 로딩 실패. " +
            "잠시 후 다시 시도해주세요.";

    }

}


/* =====================================================
   처리 버튼 이벤트
====================================================== */

document.addEventListener(
    "click",
    async function(e){

        const button =
            e.target.closest(
                ".complete-btn"
            );


        if(!button){
            return;
        }


        const id =
            button.getAttribute(
                "data-case-id"
            );


        const action =
            button.getAttribute(
                "data-action"
            );


        if(!id){
            return;
        }


        if(
            action === "complete"
        ){

            await completeCase(id);

        }


        if(
            action === "finish"
        ){

            await finishCase(id);

        }

    }
);


/* =====================================================
   최초 실행
====================================================== */

loadData();


/* =====================================================
   10초마다 갱신
====================================================== */

setInterval(
    loadData,
    10000
);


/* =====================================================
   경과시간 1초 갱신
====================================================== */

setInterval(

    () => {

        document
            .querySelectorAll(
                ".card"
            )
            .forEach(
                card => {

                    const elapsedEl =
                        card.querySelector(
                            ".time.elapsed"
                        );


                    const timeAttr =
                        card.getAttribute(
                            "data-time"
                        );


                    const finishTimeAttr =
                        card.getAttribute(
                            "data-finish-time"
                        );


                    if(
                        !elapsedEl ||
                        !timeAttr
                    ){

                        return;

                    }


                    elapsedEl.innerText =
                        "⏱ " +
                        getElapsedTime(
                            timeAttr,
                            finishTimeAttr
                        );

                }
            );

    },

    1000

);

</script>


<script>

/* =====================================================
   우클릭 방지
====================================================== */

document.addEventListener(
    "contextmenu",
    function(e){

        e.preventDefault();

        return false;

    }
);


/* =====================================================
   단축키 방지
====================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "F12"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "u"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "i"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "j"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "c"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "s"
        ){

            e.preventDefault();

            return false;

        }

    }
);

</script>
