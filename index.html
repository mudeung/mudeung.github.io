
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>무등산 산악구조 링크 문자전송</title>

  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111111">

  <!-- 인라인 스크립트와 스타일을 차단하고 같은 출처 파일만 허용 -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests">

  <link rel="stylesheet" href="./styles.css">
  <script src="./rescue.js" defer></script>
</head>

<body>
  <main class="container">
    <h1>무등산 산악구조 🆘 링크 문자전송</h1>

    <p>
      문자를 받을 번호를 입력한 후<br>
      버튼을 눌러주세요.
    </p>

    <form id="smsForm">
      <label for="phone">받는 사람 휴대전화 번호</label>

      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="01012345678"
        inputmode="numeric"
        autocomplete="off"
        maxlength="13"
        pattern="01[016789][0-9]{7,8}"
        aria-describedby="phoneHelp"
        required
      >

      <p id="phoneHelp" class="help">
        숫자만 입력하거나 하이픈을 사용해도 됩니다.
      </p>

      <button type="submit" id="sendButton">
        📩 위치 링크 문자 보내기
      </button>

      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <img
      src="./logogomir1.png"
      alt="달콩이 이미지"
      class="logo"
      width="240"
      loading="lazy"
      decoding="async"
    >

    <footer>
      ※ 버튼을 누르면 휴대폰 문자 앱이 열립니다.<br>
      실제 문자 전송은 문자 앱에서 완료해야 합니다.
    </footer>
  </main>
</body>
</html>
