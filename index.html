<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>무등산 위치 공유시스템</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#e9e9e9">
  <meta name="description" content="무등산특수산악구조팀 위치 공유 및 구조 지원 시스템">

  <!-- 외부 스크립트와 스타일은 별도 파일로 관리 -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://mudeung.github.io data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">

  <link rel="stylesheet" href="./style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <script src="./main.js" defer></script>
</head>

<body>
  <header class="header">
    <div class="logo" aria-hidden="true">
      <span class="sos">SOS</span>
    </div>
    <h1 class="title">무등산 위치 공유시스템</h1>
    <p class="subtitle">무등산특수산악구조팀</p>
  </header>

  <main class="main-content">
    <section class="icon-grid" aria-label="시스템 메뉴">
      <a class="icon-card" href="https://mudeung.github.io/gpscall.html">
        <span class="icon" aria-hidden="true">📞</span>
        <span class="icon-text">산악구조대 문자전송</span>
      </a>

      <a class="icon-card" href="https://mudeung.github.io/gps.html">
        <span class="icon" aria-hidden="true">📍</span>
        <span class="icon-text">위치확인 링크</span>
      </a>

      <a class="icon-card" href="https://mudeung.github.io/emscall.html">
        <span class="icon" aria-hidden="true">🖥️</span>
        <span class="icon-text">산악구조대 위치확인</span>
      </a>

      <a class="icon-card" href="https://mudeung.github.io/rescue.html">
        <span class="icon" aria-hidden="true">🖥️</span>
        <span class="icon-text">죄표위치 이동</span>
      </a>
    </section>
  </main>

  <dialog id="passwordPanel" class="password-panel"
    aria-labelledby="passwordHeading"
    aria-describedby="passwordTarget">
    <h2 id="passwordHeading">암호 입력</h2>
    <p id="passwordTarget">접속하려면 공통 암호를 입력하세요.</p>

    <form id="passwordForm">
      <label for="accessPassword">공통 암호</label>
      <input
        id="accessPassword"
        name="accessPassword"
        type="password"
        autocomplete="current-password"
        required
        maxlength="128"
      >

      <p id="passwordStatus" role="status" aria-live="polite"></p>

      <div class="password-actions">
        <button type="submit" class="button button-primary">확인</button>
        <button type="button" id="cancelPassword"
          class="button button-secondary">취소</button>
      </div>
    </form>
  </dialog>

<script>

/* =====================================================
   우클릭 방지
====================================================== */

document.addEventListener(
    "contextmenu",
    function(e){

        e.preventDefault();

        return false;

    }
);


/* =====================================================
   단축키 방지
====================================================== */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "F12"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "u"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "i"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "j"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.shiftKey &&
            e.key.toLowerCase() === "c"
        ){

            e.preventDefault();

            return false;

        }


        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "s"
        ){

            e.preventDefault();

            return false;

        }

    }
);

</script>
  
</body>
</html>
