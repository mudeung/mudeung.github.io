<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>🆘 사고좌표 입력</title>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ff9e145029506d6e4c72d1f2b01ea424&libraries=services"></script>

<style>

:root{
  --primary:#16a34a;
  --primary-dark:#15803d;
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --sub:#475569;
  --border:#dbe4ee;
  --shadow:0 10px 25px rgba(0,0,0,.08);
}


/* ================= 다크모드 ================= */

@media (prefers-color-scheme: dark){

  :root{
    --bg:#020617;
    --card:#0f172a;
    --text:#f8fafc;
    --sub:#94a3b8;
    --border:#1e293b;
    --shadow:0 10px 25px rgba(0,0,0,.4);
  }

}


/* ================= 기본 ================= */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{

  font-family:
    "Pretendard",
    "Apple SD Gothic Neo",
    sans-serif;

  background:var(--bg);

  color:var(--text);

  padding:14px;

  padding-bottom:105px;

}


/* ================= HEADER ================= */

.header{

  text-align:center;

  margin-bottom:16px;

}

.badge{

  display:inline-block;

  background:rgba(22,163,74,.12);

  color:var(--primary);

  padding:7px 13px;

  border-radius:999px;

  font-size:.85rem;

  font-weight:700;

  margin-bottom:8px;

}

.title{

  font-size:1.7rem;

  margin:0;

  font-weight:900;

}

.subtitle{

  margin-top:6px;

  color:var(--sub);

  font-size:.92rem;

}


/* ================= CARD ================= */

.card{

  background:var(--card);

  border:1px solid var(--border);

  border-radius:21px;

  padding:15px;

  margin-bottom:15px;

  box-shadow:var(--shadow);

}


/* ================= 입력창 / 버튼 ================= */

.ui-control{

  width:100%;

  height:50px;

  border-radius:15px;

  font-size:.98rem;

  padding:0 15px;

  margin-top:9px;

  font-weight:700;

  outline:none;

}

input.ui-control{

  border:2px solid var(--border);

  background:transparent;

  color:var(--text);

}

input.ui-control::placeholder{

  color:var(--sub);

  opacity:.8;

}

input.ui-control:focus{

  border-color:var(--primary);

}

button.ui-control{

  border:none;

  background:
    linear-gradient(
      135deg,
      var(--primary),
      var(--primary-dark)
    );

  color:white;

  cursor:pointer;

  transition:.15s;

}

button.ui-control:active{

  transform:scale(.98);

}

button.ui-control:disabled{

  opacity:.7;

  cursor:wait;

}


/* ================= 정보박스 ================= */

.info-box{

  background:rgba(22,163,74,.08);

  border:1px solid rgba(22,163,74,.2);

  border-radius:17px;

  padding:12px;

  text-align:center;

  margin-top:10px;

}

.coord{

  font-size:1.1rem;

  font-weight:800;

  letter-spacing:.2px;

}

.distance{

  font-size:1.08rem;

  font-weight:800;

  color:var(--primary);

}


/* ================= 섹션 제목 ================= */

.section-title{

  font-size:1.04rem;

  font-weight:800;

  margin-bottom:2px;

}


/* ================= 지도 ================= */

#mapComparison{

  width:100%;

  /*
    화면 높이의 65%를 사용
    기기마다 자동으로 크기 조절
  */

  height:65vh;

  /*
    너무 작은 지도 방지
  */

  min-height:500px;

  /*
    너무 커지는 것 방지
  */

  max-height:750px;

  border-radius:21px;

  overflow:hidden;

  margin-top:17px;

  border:1px solid var(--border);

}


/* ================= 하단 버튼 ================= */

.bottom-fixed{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  padding:9px 14px 15px;

  background:rgba(255,255,255,.92);

  backdrop-filter:blur(12px);

  border-top:1px solid var(--border);

  z-index:1000;

}


@media (prefers-color-scheme: dark){

  .bottom-fixed{

    background:rgba(2,6,23,.94);

  }

}


/* ================= 모바일 ================= */

@media (max-width:600px){

  body{

    padding:11px;

    padding-bottom:103px;

  }


  .header{

    margin-bottom:13px;

  }


  .title{

    font-size:1.55rem;

  }


  .subtitle{

    font-size:.88rem;

  }


  .card{

    padding:14px;

    border-radius:19px;

  }


  .ui-control{

    height:49px;

    font-size:.95rem;

  }


  /*
    모바일에서도 지도 크게
  */

  #mapComparison{

    height:65vh;

    min-height:500px;

    max-height:750px;

    border-radius:19px;

  }


  .coord{

    font-size:1.03rem;

  }


  .distance{

    font-size:1.02rem;

  }

}


/* ================= 작은 휴대폰 ================= */

@media (max-width:380px){

  #mapComparison{

    height:62vh;

    min-height:450px;

  }


  .title{

    font-size:1.45rem;

  }

}

</style>
</head>


<body>


<!-- ================= HEADER ================= -->

<div class="header">

  <div class="badge">
    무등산 특수산악구조팀
  </div>

  <h2 class="title">
    🆘 사고좌표 입력
  </h2>

  <div class="subtitle">
    현재 위치와 요구조자 위치를 확인합니다
  </div>

</div>


<!-- ================= 현재 위치 ================= -->

<div class="card">

  <button
    id="getLocation"
    class="ui-control"
  >
    📍 내 위치 확인
  </button>


  <div class="info-box">

    <div
      style="
        margin-bottom:5px;
        font-weight:700;
      "
    >
      현재 좌표
    </div>

    <div
      class="coord"
      id="coord"
    >
      위치 미확인
    </div>

  </div>

</div>


<!-- ================= 요구조자 위치 ================= -->

<div class="card">

  <div class="section-title">
    🌐 요구조자 위치 입력
  </div>


  <input
    type="number"
    step="any"
    inputmode="decimal"
    id="otherLatitude"
    class="ui-control"
    placeholder="위도 입력"
  >


  <input
    type="number"
    step="any"
    inputmode="decimal"
    id="otherLongitude"
    class="ui-control"
    placeholder="경도 입력"
  >


  <button
    id="showMapButton"
    class="ui-control"
    onclick="showLocations()"
  >
    📍 지도에서 확인
  </button>


  <div class="info-box">

    <div
      class="distance"
      id="distanceInfo"
    >
      거리 정보 없음
    </div>

  </div>


  <!-- ================= 지도 ================= -->

  <div id="mapComparison"></div>

</div>


<!-- ================= 하단 길찾기 ================= -->

<div class="bottom-fixed">

  <button
    id="kakaoRoute"
    class="ui-control"
  >
    🧭 카카오맵 길찾기
  </button>

</div>


<script>

/* ================= 변수 ================= */

let currentLat = null;
let currentLng = null;

let targetLat = null;
let targetLng = null;


/* ================= 현재 위치 ================= */

document
  .getElementById("getLocation")
  .addEventListener("click", function(){

    if(!navigator.geolocation){

      alert(
        "이 기기에서는 위치 정보를 사용할 수 없습니다."
      );

      return;

    }


    const button = this;

    button.textContent =
      "📍 현재 위치 확인 중...";

    button.disabled = true;


    navigator.geolocation.getCurrentPosition(

      function(pos){

        currentLat =
          pos.coords.latitude;

        currentLng =
          pos.coords.longitude;


        document
          .getElementById("coord")
          .textContent =
          `${currentLat.toFixed(6)} / ${currentLng.toFixed(6)}`;


        button.textContent =
          "✅ 현재 위치 확인 완료";

        button.disabled = false;

      },


      function(error){

        let message =
          "위치 정보를 가져올 수 없습니다.";


        if(error.code === 1){

          message =
            "위치 정보 사용 권한이 거부되었습니다.";

        }
        else if(error.code === 2){

          message =
            "현재 위치를 확인할 수 없습니다.";

        }
        else if(error.code === 3){

          message =
            "위치 확인 시간이 초과되었습니다.";

        }


        alert(message);


        button.textContent =
          "📍 내 위치 확인";

        button.disabled = false;

      },


      {

        enableHighAccuracy:true,

        timeout:15000,

        maximumAge:0

      }

    );

});


/* ================= 지도 표시 ================= */

function showLocations(){

  const latInput =
    document.getElementById(
      "otherLatitude"
    );


  const lngInput =
    document.getElementById(
      "otherLongitude"
    );


  targetLat =
    parseFloat(latInput.value);


  targetLng =
    parseFloat(lngInput.value);


  /* 현재 위치 확인 */

  if(
    currentLat === null ||
    currentLng === null
  ){

    alert(
      "먼저 '내 위치 확인'을 눌러 현재 위치를 확인하세요."
    );

    return;

  }


  /* 대상 좌표 확인 */

  if(
    isNaN(targetLat) ||
    isNaN(targetLng)
  ){

    alert(
      "요구조자의 위도와 경도를 정확하게 입력하세요."
    );

    return;

  }


  /* 위도 범위 */

  if(
    targetLat < -90 ||
    targetLat > 90
  ){

    alert(
      "위도는 -90 ~ 90 사이로 입력하세요."
    );

    return;

  }


  /* 경도 범위 */

  if(
    targetLng < -180 ||
    targetLng > 180
  ){

    alert(
      "경도는 -180 ~ 180 사이로 입력하세요."
    );

    return;

  }


  /* 카카오맵 API 확인 */

  if(
    typeof kakao === "undefined" ||
    !kakao.maps
  ){

    alert(
      "카카오맵을 불러오지 못했습니다."
    );

    return;

  }


  const mapContainer =
    document.getElementById(
      "mapComparison"
    );


  /* 기존 지도 초기화 */

  mapContainer.innerHTML = "";


  /* 현재 위치 */

  const myPosition =
    new kakao.maps.LatLng(
      currentLat,
      currentLng
    );


  /* 요구조자 위치 */

  const targetPosition =
    new kakao.maps.LatLng(
      targetLat,
      targetLng
    );


  /* 지도 생성 */

  const map =
    new kakao.maps.Map(

      mapContainer,

      {

        center:targetPosition,

        level:6

      }

    );


  /* ================= 현재 위치 마커 ================= */

  new kakao.maps.Marker({

    position:myPosition,

    map:map

  });


  /* ================= 요구조자 마커 ================= */

  new kakao.maps.Marker({

    position:targetPosition,

    map:map

  });


  /* ================= 연결선 ================= */

  const polyline =
    new kakao.maps.Polyline({

      map:map,

      path:[
        myPosition,
        targetPosition
      ],

      strokeWeight:4,

      strokeColor:"#16a34a",

      strokeOpacity:.9,

      strokeStyle:"solid"

    });


  /* ================= 거리 ================= */

  const distance =
    polyline.getLength();


  document
    .getElementById("distanceInfo")
    .textContent =
    `직선거리 ${(distance / 1000).toFixed(2)} km`;


  /* ================= 두 위치 모두 표시 ================= */

  const bounds =
    new kakao.maps.LatLngBounds();


  bounds.extend(myPosition);

  bounds.extend(targetPosition);


  map.setBounds(bounds);


  /*
    너무 가까운 경우
    지나치게 확대되지 않도록 조정
  */

  setTimeout(function(){

    if(map.getLevel() < 4){

      map.setLevel(4);

    }

  },100);

}


/* ================= 카카오맵 길찾기 ================= */

document
  .getElementById("kakaoRoute")
  .addEventListener("click", function(){

    if(
      targetLat === null ||
      targetLng === null
    ){

      alert(
        "먼저 요구조자 위치를 지도에서 확인하세요."
      );

      return;

    }


    location.href =
      `kakaomap://route?ep=${targetLat},${targetLng}&by=FOOT`;

});


/* ================= 우클릭 방지 ================= */

document.addEventListener(
  "contextmenu",
  function(e){

    e.preventDefault();

  }
);


/* ================= 단축키 방지 ================= */

document.addEventListener(
  "keydown",
  function(e){

    /* F12 */

    if(e.key === "F12"){

      e.preventDefault();

      return false;

    }


    /* Ctrl + U */

    if(
      e.ctrlKey &&
      e.key.toLowerCase() === "u"
    ){

      e.preventDefault();

      return false;

    }


    /* Ctrl + Shift + I */

    if(
      e.ctrlKey &&
      e.shiftKey &&
      e.key.toLowerCase() === "i"
    ){

      e.preventDefault();

      return false;

    }


    /* Ctrl + Shift + J */

    if(
      e.ctrlKey &&
      e.shiftKey &&
      e.key.toLowerCase() === "j"
    ){

      e.preventDefault();

      return false;

    }


    /* Ctrl + Shift + C */

    if(
      e.ctrlKey &&
      e.shiftKey &&
      e.key.toLowerCase() === "c"
    ){

      e.preventDefault();

      return false;

    }


    /* Ctrl + S */

    if(
      e.ctrlKey &&
      e.key.toLowerCase() === "s"
    ){

      e.preventDefault();

      return false;

    }

  }
);

</script>


</body>
</html>
