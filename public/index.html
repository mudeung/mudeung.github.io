
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>무등산 산악구조 🆘 링크 문자전송</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  text-align: center;
  padding: 30px 18px;
  margin: 0;
}
h1 { color: #ff4d4d; font-size: 25px; }
p { line-height: 1.7; }
input {
  display: block;
  width: 100%;
  max-width: 360px;
  padding: 15px;
  margin: 14px auto;
  font-size: 16px;
  border: 0;
  border-radius: 8px;
}
button {
  width: 100%;
  max-width: 360px;
  padding: 17px;
  margin: 6px auto;
  font-size: 17px;
  font-weight: bold;
  border: 0;
  border-radius: 10px;
  background: #ff4d4d;
  color: white;
  cursor: pointer;
}
button:disabled { opacity: .5; }
#status {
  max-width: 360px;
  margin: 18px auto;
  overflow-wrap: anywhere;
  line-height: 1.7;
}
.footer { margin-top: 25px; font-size: 13px; color: #aaa; }
img { max-width: 180px; height: auto; margin-top: 20px; }
</style>
</head>
<body>

<h1>무등산 산악구조 🆘</h1>
<p>받는 사람의 전화번호를 입력하고<br>
위치 확인 링크를 문자로 전송하세요.</p>

<input
  type="tel"
  id="phone"
  inputmode="tel"
  autocomplete="tel"
  placeholder="받는 사람 번호 (예: 01012345678)"
  aria-label="받는 사람 전화번호">

<button id="sendButton" type="button">
📩 위치 링크 문자 보내기
</button>

<div id="status" role="status" aria-live="polite"></div>

<div class="footer">
※ 휴대폰에서 실행해야 문자 앱이 열립니다.<br>
※ 링크는 최초 접속 후 1시간 동안 유효합니다.
</div>

<img src="/logogomir1.png" alt="달콩이 이미지">

<script>
const phoneInput = document.getElementById("phone");
const sendButton = document.getElementById("sendButton");
const statusBox = document.getElementById("status");

function setStatus(message) {
  statusBox.textContent = message;
}

function validPhone(value) {
  const digits = value.replace(/[\s()-]/g, "");
  return /^\+?[0-9]{8,15}$/.test(digits);
}

sendButton.addEventListener("click", async () => {
  const phone = phoneInput.value.trim();

  if (!validPhone(phone)) {
    setStatus("전화번호를 올바르게 입력해주세요.");
    phoneInput.focus();
    return;
  }

  // 비밀키를 HTML에 저장하지 않고 운영자가 직접 입력
  const adminKey = window.prompt("구조대 관리자 인증키를 입력하세요.");

  if (!adminKey) {
    setStatus("인증이 취소되었습니다.");
    return;
  }

  sendButton.disabled = true;
  setStatus("안전한 임시 링크를 생성하고 있습니다.");

  try {
    const response = await fetch("/api/create-link", {
      method: "POST",
      headers: {
        "X-Admin-Key": adminKey
      }
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "링크 생성에 실패했습니다.");
    }

    const message =
      "[무등산 산악구조 요청]\n" +
      "국립공원 특수구조대입니다.\n" +
      "아래 링크를 열어 현재 위치를 확인해 주세요.\n" +
      "최초 접속 후 1시간 동안 유효합니다.\n" +
      data.url;

    const encoded = encodeURIComponent(message);
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const separator = isIOS ? "&" : "?";

    setStatus("임시 링크가 생성되었습니다. 문자 앱을 여는 중입니다.");

    window.location.href =
      "sms:" + phone + separator + "body=" + encoded;

  } catch (error) {
    setStatus(error.message || "오류가 발생했습니다.");
  } finally {
    sendButton.disabled = false;
  }
});
</script>
</body>
</html>
